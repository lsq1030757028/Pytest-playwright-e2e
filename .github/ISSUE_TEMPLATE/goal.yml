name: Goal / Change
description: Define an approved goal, scope, acceptance criteria, risks, UX impact, mandate, and release constraints
title: "[Goal] "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Use this form for nontrivial development goals. The final SPEC, implementation, functional evidence, experience evidence, and release follow `docs/github-development-ssot.md` and `docs/ux-assurance-ssot.md`.

  - type: textarea
    id: outcome
    attributes:
      label: Goal and expected outcome
      description: Describe the business or engineering outcome rather than a preferred implementation.
      placeholder: What must be true when this Goal is complete?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: State both in-scope and out-of-scope work.
      placeholder: |
        In scope:
        - ...

        Out of scope:
        - ...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use observable, falsifiable outcomes. Include user-visible success and recovery when applicable. Do not prescribe test counts.
      placeholder: |
        - Given ..., when ..., then ...
        - The system must reject ...
        - The user must observe ...
    validations:
      required: true

  - type: textarea
    id: authority
    attributes:
      label: Requirement and decision authority
      description: Identify who or what can approve Requirement, Oracle, Experience Oracle, Policy, scope, or Mandate changes.
      placeholder: Product owner, approved requirement, design system, ADR, production invariant, security policy...
    validations:
      required: true

  - type: dropdown
    id: autonomy_mandate
    attributes:
      label: Autonomous execution mandate
      description: Select whether the Goal is covered by the active M1-M3 standing mandate.
      options:
        - MANDATE-AUTONOMY-M1-M3 covers this Goal
        - Not covered; separate authority is required
        - Requires scope or authority investigation
    validations:
      required: true

  - type: dropdown
    id: milestone
    attributes:
      label: Roadmap milestone
      description: Mandate coverage is limited to approved M1-M3 work.
      options:
        - M1 Memory and Controlled Evolution
        - M2 Cross-model Generalization
        - M3 Project and Architecture Generalization
        - Cross-cutting M1-M3 quality plane
        - Outside M1-M3
        - Not applicable
    validations:
      required: true

  - type: dropdown
    id: user_facing_effect
    attributes:
      label: User-facing effect
      description: Unknown impact defaults to UX2 during planning.
      options:
        - No user-facing behavior change
        - Normal user-facing change
        - Important workflow or visible business-rule change
        - Critical money, auth, privacy, destructive, irreversible, or data-loss journey
        - Unknown or requires investigation
    validations:
      required: true

  - type: textarea
    id: affected_journeys
    attributes:
      label: Affected user journeys and Human UAT
      description: Identify user goals, Experience Oracle or Journey references, accessibility/recovery impact, and whether Human UAT is required.
      placeholder: |
        Journeys:
        - ...
        Accessibility / recovery impact:
        - ...
        Human UAT:
        - required / not required with authority

  - type: dropdown
    id: risk_signals
    attributes:
      label: Known risk signals
      description: Select every known signal. The final DEV and UX profiles may be escalated later.
      multiple: true
      options:
        - Documentation or non-behavioral only
        - Isolated deterministic logic
        - API, storage, schema, workflow, or process boundary
        - Oracle, Experience Oracle, Policy, Permission, or Assurance Floor
        - Memory, self-evolution, or asset promotion
        - Synthetic User, UX Gate, or UAT readiness
        - Model routing or automated escalation
        - Browser, mobile, mini-program, embedded, or real device
        - Financial, privacy, security, destructive, or irreversible behavior
        - CI, release, deployment, secret, or production data
        - Unknown or requires investigation
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and dependencies
      description: Include technology, environment, persona, journey, model, device, locale, accessibility, network, data, secret, cost, timing, and compatibility constraints.
      placeholder: Dependencies, unavailable environments, device limits, cost ceilings, deadlines...

  - type: textarea
    id: current_evidence
    attributes:
      label: Existing evidence and assets
      description: Link related tests, journeys, traces, Replay Bundles, benchmarks, ADRs, requirements, SPECs, design-system assets, or prior PRs.
      placeholder: Existing evidence, asset paths, or GitHub references...

  - type: textarea
    id: deployment
    attributes:
      label: Deployment, recovery, and rollback expectations
      description: State whether this changes runtime, data, models, memory, devices, UX Gate mode, CI, or releases.
      placeholder: Deployment path, shadow/advisory/blocking mode, canary, rollback, recovery, irreversible effects...

  - type: dropdown
    id: auto_merge
    attributes:
      label: Agent auto-merge authority within this Goal
      description: In-mandate DEV0-DEV3 may auto-merge only after all SSOT gates pass. DEV-E production and out-of-mandate actions are excluded.
      options:
        - Allowed under active mandate when SSOT gates pass
        - Not allowed; separate authority required
        - Undecided or requires investigation
    validations:
      required: true

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Governance acknowledgement
      options:
        - label: I understand that Requirement, Experience Oracle, or Mandate changes must be versioned and re-assessed rather than silently overwriting prior evidence.
          required: true
        - label: I understand that functional and experience evidence is selected by risk and real boundaries, not by a fixed test-count checklist.
          required: true
        - label: I understand that AI-only UX findings cannot block and Synthetic Users do not replace Human UAT.
          required: true
        - label: I understand that production data, secrets, destructive external writes, material irreversible cost, and DEV-E production actions are not covered by routine autonomy.
          required: true
