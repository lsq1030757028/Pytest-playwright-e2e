name: m1a-status-guard-migration

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m1a-status-guard-migration.yml"

permissions:
  contents: write

jobs:
  migrate-stale-status-guards:
    if: github.event.pull_request.head.ref == 'docs/m1a-runtime-contracts-final-ledger-clean'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/m1a-runtime-contracts-final-ledger-clean
          fetch-depth: 0

      - name: Validate M1A claim fencing
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          matched=false
          for attempt in $(seq 1 12); do
            git fetch --force origin \
              ops/hourly-github-relay-control:refs/remotes/origin/ops/hourly-github-relay-control
            git show \
              origin/ops/hourly-github-relay-control:.agent/relay/work-claims.json \
              > /tmp/work-claims.json
            if ACTUAL_HEAD="${actual_head}" python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          claims = json.loads(Path('/tmp/work-claims.json').read_text(encoding='utf-8'))
          claim = claims.get('claims', {}).get('M1A-RUNTIME-CONTRACTS-CLOSE', {})
          expected = {
              'claim_token': 'claim-m1a-runtime-contracts-close-human-4-20260806T132500Z',
              'surface': 'HUMAN_CONTROL',
              'state': 'INTEGRATING',
              'target_branch': 'docs/m1a-runtime-contracts-final-ledger-clean',
              'target_pr': 64,
              'expected_head_sha': os.environ['ACTUAL_HEAD'],
          }
          valid = claims.get('enabled') is True and all(
              claim.get(key) == value for key, value in expected.items()
          )
          sys.exit(0 if valid else 1)
          PY
            then
              matched=true
              break
            fi
            sleep 5
          done
          if [[ "${matched}" != "true" ]]; then
            echo "Claim registry did not fence current branch Head ${actual_head}" >&2
            exit 1
          fi

      - name: Replace only confirmed stale status guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'tests/unit/test_m1a_memory_contracts_spec.py': [
                  (
                      'assert "M1A Runtime Contracts：NEXT / DEV3" in status',
                      'assert "M1A Runtime Contracts：MERGED / CLOSED" in status',
                  ),
                  (
                      'assert "M1B Store & Progressive Retrieval：BLOCKED" in status',
                      'assert "M1B Store & Progressive Retrieval：NEXT / SPEC" in status',
                  ),
                  (
                      'assert roadmap["next_execution_sequence"][0] == "M1A_RUNTIME_CONTRACTS"',
                      'assert roadmap["next_execution_sequence"][0] == (\n'
                      '        "M1B_STORE_AND_PROGRESSIVE_RETRIEVAL_SPEC"\n'
                      '    )',
                  ),
                  (
                      'assert m1["active_module"] == "M1A_RUNTIME_CONTRACTS"',
                      'assert m1["active_module"] == (\n'
                      '        "M1B_STORE_AND_PROGRESSIVE_RETRIEVAL_SPEC"\n'
                      '    )',
                  ),
                  (
                      'assert m1["module_status"]["M1A_RUNTIME_CONTRACTS"] == "NEXT"',
                      'assert m1["module_status"]["M1A_RUNTIME_CONTRACTS"] == (\n'
                      '        "MERGED_CLOSED"\n'
                      '    )',
                  ),
                  (
                      'assert m1["module_status"]["M1B"] == "BLOCKED"',
                      'assert m1["module_status"]["M1B"] == "SPEC_NEXT"',
                  ),
              ],
              'tests/unit/test_ux_shadow_delivery_status.py': [
                  (
                      'assert "TodoMVC UX Mutation Proof：SPEC_DRAFT" in project_status',
                      'assert "TodoMVC UX Mutation Proof SPEC：MERGED / CLOSED" in project_status',
                  ),
                  (
                      'assert "UX Mutation Proof Runner：NOT_IMPLEMENTED" in project_status',
                      'assert "UX Mutation Proof Runner：MERGED / CLOSED" in project_status',
                  ),
                  (
                      'assert "M1A Memory Contracts & Namespaces：SPEC_DRAFT_NEXT" in project_status',
                      'assert "M1A Runtime Contracts：MERGED / CLOSED" in project_status\n'
                      '    assert "M1B Store & Progressive Retrieval：NEXT / SPEC" in project_status',
                  ),
              ],
              'tests/unit/test_ux1_todomvc_mutation_spec.py': [
                  (
                      'assert "TodoMVC UX Mutation Proof：SPEC_DRAFT" in project_status',
                      'assert "TodoMVC UX Mutation Proof SPEC：MERGED / CLOSED" in project_status',
                  ),
                  (
                      'assert "M1A Memory Contracts & Namespaces：SPEC_DRAFT_NEXT" in project_status',
                      'assert "UX Mutation Proof Runner：MERGED / CLOSED" in project_status\n'
                      '    assert "M1A Runtime Contracts：MERGED / CLOSED" in project_status\n'
                      '    assert "M1B Store & Progressive Retrieval：NEXT / SPEC" in project_status',
                  ),
              ],
              'tests/unit/test_ux1_mutation_delivery_status.py': [
                  (
                      'assert "M1A Memory Contracts & Namespaces：SPEC_DRAFT_NEXT" in project_status',
                      'assert "M1A Runtime Contracts：MERGED / CLOSED" in project_status\n'
                      '    assert "M1B Store & Progressive Retrieval：NEXT / SPEC" in project_status',
                  ),
              ],
          }

          for file_name, edits in replacements.items():
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(
                          f'{file_name}: expected exactly one occurrence of {old!r}, got {count}'
                      )
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          Path('.github/workflows/m1a-status-guard-migration.yml').unlink()
          PY

      - name: Validate migrated guards
        shell: bash
        run: |
          set -euo pipefail
          uvx ruff@0.16.1 check \
            tests/unit/test_m1a_memory_contracts_spec.py \
            tests/unit/test_ux_shadow_delivery_status.py \
            tests/unit/test_ux1_todomvc_mutation_spec.py \
            tests/unit/test_ux1_mutation_delivery_status.py
          python -m py_compile \
            tests/unit/test_m1a_memory_contracts_spec.py \
            tests/unit/test_ux_shadow_delivery_status.py \
            tests/unit/test_ux1_todomvc_mutation_spec.py \
            tests/unit/test_ux1_mutation_delivery_status.py

      - name: Commit migrated guards and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lsq1030757028"
          git config user.email "lsq1030757028@gmail.com"
          git add \
            tests/unit/test_m1a_memory_contracts_spec.py \
            tests/unit/test_ux_shadow_delivery_status.py \
            tests/unit/test_ux1_todomvc_mutation_spec.py \
            tests/unit/test_ux1_mutation_delivery_status.py \
            .github/workflows/m1a-status-guard-migration.yml
          git commit -m \
            "test(m1a): migrate stale cross-gate status guards [HUMAN:human-m1a-close-r9-20260806T132900Z]"
          git push origin HEAD:docs/m1a-runtime-contracts-final-ledger-clean
