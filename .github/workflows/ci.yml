name: test-workflow-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra test

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Lint
        run: uv run ruff check .

      - name: Development SSOT validation
        run: |
          mkdir -p test-results
          uv run pytest tests/unit/test_github_development_ssot.py \
            --junitxml=test-results/junit-development-ssot.xml

      - name: Autonomous execution mandate validation
        run: >-
          uv run pytest tests/unit/test_autonomous_execution_mandate.py
          --junitxml=test-results/junit-autonomous-execution-mandate.xml

      - name: UX0 Synthetic User SPEC validation
        run: >-
          uv run pytest tests/unit/test_ux0_synthetic_user_spec.py
          --junitxml=test-results/junit-ux0-synthetic-user-spec.xml

      - name: UX1 TodoMVC Mutation Proof SPEC validation
        run: >-
          uv run pytest tests/unit/test_ux1_todomvc_mutation_spec.py
          --junitxml=test-results/junit-ux1-todomvc-mutation-spec.xml

      - name: M1.0 Memory SPEC validation
        run: >-
          uv run pytest tests/unit/test_m1_0_memory_spec.py
          --junitxml=test-results/junit-m1.0-memory-spec.xml

      - name: M1.0 Memory Benchmark Harness validation
        env:
          BENCHMARK_CODE_SHA: ${{ github.sha }}
        run: |
          uv run pytest tests/unit/test_memory_benchmark.py \
            --junitxml=test-results/junit-m1.0-memory-benchmark-unit.xml
          uv run pytest tests/integration/test_memory_benchmark_harness_integration.py \
            -m harness_integration \
            --junitxml=test-results/junit-m1.0-memory-benchmark-integration.xml
          rm -rf test-results/m1.0-memory-benchmark
          uv run test-workflow memory validate benchmarks/memory/m1.0/campaign.yaml
          uv run test-workflow memory run benchmarks/memory/m1.0/campaign.yaml \
            --output test-results/m1.0-memory-benchmark
          uv run test-workflow memory replay test-results/m1.0-memory-benchmark

      - name: Collect tests
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          uv run pytest --collect-only 2>&1 | tee test-results/collect.log

      - name: Unit and API tests
        run: uv run pytest tests/unit tests/api --junitxml=test-results/junit-core.xml

      - name: Harness 3.0A contracts integration
        run: >-
          uv run pytest tests/integration/test_harness_contracts_integration.py
          -m harness_integration
          --junitxml=test-results/junit-harness-3.0a.xml

      - name: Harness 3.0B registry and store integration
        run: >-
          uv run pytest tests/integration/test_harness_registry_integration.py
          -m harness_integration
          --junitxml=test-results/junit-harness-3.0b.xml

      - name: Harness 3.0C policy integration
        run: >-
          uv run pytest tests/integration/test_harness_policy_integration.py
          -m harness_integration
          --junitxml=test-results/junit-harness-3.0c.xml

      - name: Harness 3.0D orchestrator integration
        run: >-
          uv run pytest tests/integration/test_harness_orchestrator_integration.py
          -m harness_integration
          --junitxml=test-results/junit-harness-3.0d.xml

      - name: Harness 3.0E existing adapters integration
        run: >-
          uv run pytest tests/integration/test_harness_existing_adapters_integration.py
          -m harness_integration
          --junitxml=test-results/junit-harness-3.0e.xml

      - name: Stage 3 governance integration
        run: >-
          uv run pytest tests/integration/test_harness_governance_integration.py
          -m harness_integration
          --junitxml=test-results/junit-stage-3-governance.xml

      - name: Stage 4 intelligence integration
        run: >-
          uv run pytest tests/integration/test_harness_intelligence_integration.py
          -m harness_integration
          --junitxml=test-results/junit-stage-4-intelligence.xml

      - name: Stage 5 generation proof integration
        run: >-
          uv run pytest tests/integration/test_harness_generation_integration.py
          -m harness_integration
          --junitxml=test-results/junit-stage-5-generation.xml

      - name: Stage 6 diagnosis and repair integration
        run: >-
          uv run pytest tests/integration/test_harness_diagnosis_integration.py
          -m harness_integration
          --junitxml=test-results/junit-stage-6-diagnosis.xml

      - name: Stage 7 regression benchmark integration
        run: >-
          uv run pytest tests/integration/test_harness_regression_integration.py
          -m harness_integration
          --junitxml=test-results/junit-stage-7-regression.xml

      - name: Complete requirement-to-verdict workflow
        run: >-
          uv run pytest tests/integration/test_full_agent_workflow.py
          -m harness_integration
          --junitxml=test-results/junit-full-agent-workflow.xml

      - name: Ledger and release asset integration
        run: |
          uv run test-harness-ledger validate docs/implementation-ledger.yaml
          uv run pytest tests/integration/test_harness_ledger_release_integration.py -m harness_integration --junitxml=test-results/junit-ledger-release.xml
          uv build

      - name: Validate deterministic Replay Bundle
        run: |
          uv run test-workflow spec validate experiments/todomvc-golden-loop/spec/test-spec.yaml
          uv run test-workflow mock verify experiments/todomvc-golden-loop
          uv run test-workflow bundle validate experiments/todomvc-golden-loop
          uv run test-workflow replay experiments/todomvc-golden-loop

      - name: Browser smoke tests
        run: >-
          uv run pytest tests/e2e
          -m "smoke and not destructive"
          --browser chromium
          --tracing retain-on-failure
          --screenshot only-on-failure
          --video retain-on-failure
          --output test-results
          --junitxml=test-results/junit-e2e.xml

      - name: Live browser integration
        env:
          RUN_LIVE_E2E: "1"
        run: >-
          uv run pytest tests/e2e/specs/test_live_free_time_workflow.py
          -m integration
          --browser chromium
          --tracing retain-on-failure
          --screenshot only-on-failure
          --video retain-on-failure
          --output test-results
          --junitxml=test-results/junit-live-e2e.xml

      - name: Pinned TodoMVC target integration
        env:
          RUN_TARGET_INTEGRATION: "1"
        run: >-
          uv run pytest tests/integration/test_todomvc_target.py
          -m target_integration
          --browser chromium
          --tracing retain-on-failure
          --screenshot only-on-failure
          --video retain-on-failure
          --output test-results
          --junitxml=test-results/junit-target-integration.xml

      - name: TodoMVC mutation proof
        run: >-
          uv run test-workflow proof run proofs/todomvc/plan.yaml
          --workspace .target-work/todomvc-proof
          --output test-results/todomvc-proof

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test-results
            dist
          if-no-files-found: warn
          retention-days: 30
