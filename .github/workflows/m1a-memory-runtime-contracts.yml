name: m1a-memory-runtime-contracts

on:
  pull_request:
    paths:
      - "src/test_workflow/memory_contracts/**"
      - "tests/memory_contract_fixtures.py"
      - "tests/unit/test_memory_contract_*.py"
      - "tests/integration/test_memory_contract_*.py"
      - "docs/m1a-memory-runtime-contracts.md"
      - "docs/testing/m1a-memory-runtime-contracts-test-design.md"
      - ".github/workflows/m1a-memory-runtime-contracts.yml"
  push:
    branches: [main]
    paths:
      - "src/test_workflow/memory_contracts/**"
      - "tests/memory_contract_fixtures.py"
      - "tests/unit/test_memory_contract_*.py"
      - "tests/integration/test_memory_contract_*.py"
      - "docs/m1a-memory-runtime-contracts.md"
      - "docs/testing/m1a-memory-runtime-contracts-test-design.md"
      - ".github/workflows/m1a-memory-runtime-contracts.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: read
  pull-requests: read
  packages: read

jobs:
  runtime-contract-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra test

      - name: Prepare evidence directory
        run: |
          mkdir -p test-results/m1a-memory-runtime
          printf 'status=started\n' > test-results/m1a-memory-runtime/run-state.txt

      - name: Lint M1A runtime contracts
        run: |
          uv run ruff check \
            src/test_workflow/memory_contracts \
            tests/memory_contract_fixtures.py \
            tests/unit/test_memory_contract_models.py \
            tests/unit/test_memory_contract_policy.py \
            tests/unit/test_memory_contract_ports.py \
            tests/integration/test_memory_contract_reference.py \
            tests/integration/test_memory_contract_proof.py

      - name: Unit and contract validation
        run: |
          uv run pytest \
            tests/unit/test_memory_contract_models.py \
            tests/unit/test_memory_contract_policy.py \
            tests/unit/test_memory_contract_ports.py \
            --junitxml=test-results/m1a-memory-runtime/junit-unit-contract.xml

      - name: Reference adapter integration
        run: |
          uv run pytest \
            tests/integration/test_memory_contract_reference.py \
            --junitxml=test-results/m1a-memory-runtime/junit-reference-integration.xml

      - name: Replay and tamper integration
        run: |
          uv run pytest \
            tests/integration/test_memory_contract_proof.py \
            --junitxml=test-results/m1a-memory-runtime/junit-proof-replay.xml

      - name: Run deterministic M1A contract proof
        run: |
          uv run python -m test_workflow.memory_contracts.proof run \
            --output-dir test-results/m1a-memory-runtime/proof \
            --code-sha "${GITHUB_SHA}"

      - name: Independent replay
        run: |
          uv run python -m test_workflow.memory_contracts.proof replay \
            --output-dir test-results/m1a-memory-runtime/proof

      - name: Upload M1A runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1a-memory-runtime-contract-results
          path: test-results/m1a-memory-runtime
          if-no-files-found: error
          retention-days: 30

  cleanup-implementation-branch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: runtime-contract-proof
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged M1A runtime implementation branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          IMPLEMENTATION_BRANCH: agent/m1a-memory-runtime-contracts
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GH_REPO}/git/ref/heads/${IMPLEMENTATION_BRANCH}" \
            >/dev/null 2>&1; then
            gh api --method DELETE \
              "repos/${GH_REPO}/git/refs/heads/${IMPLEMENTATION_BRANCH}"
            echo "deleted ${IMPLEMENTATION_BRANCH}"
          else
            echo "already absent ${IMPLEMENTATION_BRANCH}"
          fi

  closure-evidence-probe:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/m1a-runtime-closure-evidence'
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 0585e357aebda650ee50ee95ff962b3ac81f6d4c
      IMPLEMENTATION_BRANCH: agent/m1a-memory-runtime-contracts
    steps:
      - name: Verify authoritative main delivery state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100" \
            --jq '.workflow_runs | map({id,name,event,head_branch,head_sha,status,conclusion,run_number,created_at,updated_at,html_url}) | sort_by(.id)' \
            | tee /tmp/m1a-main-runs.json

          echo '--- merged PR ---'
          gh api "repos/${GITHUB_REPOSITORY}/pulls/44" \
            --jq '{number,state,merged,merged_at,merge_commit_sha,html_url}' \
            | tee /tmp/m1a-pr.json

          echo '--- goal issue ---'
          gh api "repos/${GITHUB_REPOSITORY}/issues/43" \
            --jq '{number,state,state_reason,html_url}'

          echo '--- implementation branch ---'
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${IMPLEMENTATION_BRANCH}" >/dev/null 2>&1; then
            echo "implementation_branch_present=true"
            exit 1
          else
            echo "implementation_branch_present=false"
          fi

          jq -e '.merged == true and .merge_commit_sha == "0585e357aebda650ee50ee95ff962b3ac81f6d4c"' /tmp/m1a-pr.json
          jq -e 'map(select(.event == "push" and .head_sha == "0585e357aebda650ee50ee95ff962b3ac81f6d4c" and .status == "completed" and .conclusion == "success") | .name) | index("m1a-memory-runtime-contracts") != null' /tmp/m1a-main-runs.json
          jq -e 'map(select(.event == "push" and .head_sha == "0585e357aebda650ee50ee95ff962b3ac81f6d4c" and .status == "completed" and .conclusion == "success") | .name) | index("test-workflow-ci") != null' /tmp/m1a-main-runs.json
          jq -e 'map(select(.event == "push" and .head_sha == "0585e357aebda650ee50ee95ff962b3ac81f6d4c" and .status == "completed" and .conclusion == "success") | .name) | index("release-test-harness") != null' /tmp/m1a-main-runs.json
