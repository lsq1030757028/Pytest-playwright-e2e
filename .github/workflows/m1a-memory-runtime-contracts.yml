name: m1a-memory-runtime-contracts

on:
  pull_request:
    paths:
      - ".github/workflows/m1a-memory-runtime-contracts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-governed-hardening:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m1a-memory-runtime-contracts
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Apply reviewed hardening patch
        shell: bash
        run: |
          set -euo pipefail
          sha256sum tools/m1a-hardening/chunk-*.b64
          cat tools/m1a-hardening/chunk-*.b64 | base64 --decode > /tmp/m1a-hardening.patch
          test -s /tmp/m1a-hardening.patch
          git apply --check /tmp/m1a-hardening.patch
          git apply /tmp/m1a-hardening.patch
          rm -rf tools/m1a-hardening
          rm -f .github/workflows/apply-m1a-hardening.yml
          cp .github/m1a-memory-runtime-contracts.base.yml \
            .github/workflows/m1a-memory-runtime-contracts.yml
          rm .github/m1a-memory-runtime-contracts.base.yml
          git diff --check

      - name: Verify hardened contracts and evidence
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra test
          uv run ruff check \
            src/test_workflow/memory_contracts \
            tests/memory_contract_fixtures.py \
            tests/unit/test_memory_contract_models.py \
            tests/unit/test_memory_contract_policy.py \
            tests/unit/test_memory_contract_ports.py \
            tests/integration/test_memory_contract_reference.py \
            tests/integration/test_memory_contract_proof.py
          uv run pytest \
            tests/unit/test_memory_contract_models.py \
            tests/unit/test_memory_contract_policy.py \
            tests/unit/test_memory_contract_ports.py \
            tests/integration/test_memory_contract_reference.py \
            tests/integration/test_memory_contract_proof.py
          rm -rf test-results/m1a-hardening-proof
          uv run python -m test_workflow.memory_contracts.proof run \
            --output-dir test-results/m1a-hardening-proof \
            --code-sha "${GITHUB_SHA}"
          uv run python -m test_workflow.memory_contracts.proof replay \
            --output-dir test-results/m1a-hardening-proof

      - name: Publish verified hardening commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden M1A runtime contract enforcement"
          git push origin HEAD:agent/m1a-memory-runtime-contracts
