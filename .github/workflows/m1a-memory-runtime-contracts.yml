name: m1a-memory-runtime-contracts

on:
  pull_request:
    paths:
      - "src/test_workflow/memory_contracts/**"
      - "tests/memory_contract_fixtures.py"
      - "tests/unit/test_memory_contract_*.py"
      - "tests/integration/test_memory_contract_*.py"
      - "docs/m1a-memory-runtime-contracts.md"
      - "docs/testing/m1a-memory-runtime-contracts-test-design.md"
      - ".github/workflows/m1a-memory-runtime-contracts.yml"
  push:
    branches: [main]
    paths:
      - "src/test_workflow/memory_contracts/**"
      - "tests/memory_contract_fixtures.py"
      - "tests/unit/test_memory_contract_*.py"
      - "tests/integration/test_memory_contract_*.py"
      - "docs/m1a-memory-runtime-contracts.md"
      - "docs/testing/m1a-memory-runtime-contracts-test-design.md"
      - ".github/workflows/m1a-memory-runtime-contracts.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: read
  pull-requests: read
  packages: read

jobs:
  runtime-contract-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra test

      - name: Prepare evidence directory
        run: |
          mkdir -p test-results/m1a-memory-runtime
          printf 'status=started\n' > test-results/m1a-memory-runtime/run-state.txt

      - name: Lint M1A runtime contracts
        run: |
          uv run ruff check \
            src/test_workflow/memory_contracts \
            tests/memory_contract_fixtures.py \
            tests/unit/test_memory_contract_models.py \
            tests/unit/test_memory_contract_policy.py \
            tests/unit/test_memory_contract_ports.py \
            tests/integration/test_memory_contract_reference.py \
            tests/integration/test_memory_contract_proof.py

      - name: Unit and contract validation
        run: |
          uv run pytest \
            tests/unit/test_memory_contract_models.py \
            tests/unit/test_memory_contract_policy.py \
            tests/unit/test_memory_contract_ports.py \
            --junitxml=test-results/m1a-memory-runtime/junit-unit-contract.xml

      - name: Reference adapter integration
        run: |
          uv run pytest \
            tests/integration/test_memory_contract_reference.py \
            --junitxml=test-results/m1a-memory-runtime/junit-reference-integration.xml

      - name: Replay and tamper integration
        run: |
          uv run pytest \
            tests/integration/test_memory_contract_proof.py \
            --junitxml=test-results/m1a-memory-runtime/junit-proof-replay.xml

      - name: Run deterministic M1A contract proof
        run: |
          uv run python -m test_workflow.memory_contracts.proof run \
            --output-dir test-results/m1a-memory-runtime/proof \
            --code-sha "${GITHUB_SHA}"

      - name: Independent replay
        run: |
          uv run python -m test_workflow.memory_contracts.proof replay \
            --output-dir test-results/m1a-memory-runtime/proof

      - name: Upload M1A runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1a-memory-runtime-contract-results
          path: test-results/m1a-memory-runtime
          if-no-files-found: error
          retention-days: 30

  cleanup-implementation-branch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: runtime-contract-proof
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged M1A runtime implementation branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          IMPLEMENTATION_BRANCH: agent/m1a-memory-runtime-contracts
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GH_REPO}/git/ref/heads/${IMPLEMENTATION_BRANCH}" \
            >/dev/null 2>&1; then
            gh api --method DELETE \
              "repos/${GH_REPO}/git/refs/heads/${IMPLEMENTATION_BRANCH}"
            echo "deleted ${IMPLEMENTATION_BRANCH}"
          else
            echo "already absent ${IMPLEMENTATION_BRANCH}"
          fi

  closure-evidence-probe:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/m1a-runtime-closure-evidence'
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 0585e357aebda650ee50ee95ff962b3ac81f6d4c
      IMPLEMENTATION_BRANCH: agent/m1a-memory-runtime-contracts
      GOAL_ISSUE: "43"
      IMPLEMENTATION_PR: "44"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/m1a-runtime-closure-evidence
          fetch-depth: 0

      - name: Capture and verify authoritative main-delivery evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/evidence
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100" \
            --jq '[.workflow_runs[] | {id,name,event,head_branch,head_sha,status,conclusion,run_number,created_at,updated_at,html_url}]' \
            > /tmp/runs-pages.jsonl
          jq -s 'add | unique_by(.id) | sort_by(.id)' /tmp/runs-pages.jsonl > /tmp/runs.json

          branch_present=false
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${IMPLEMENTATION_BRANCH}" >/dev/null 2>&1; then
            branch_present=true
          fi

          issue_json=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${GOAL_ISSUE}")
          pr_json=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${IMPLEMENTATION_PR}")
          commit_json=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}")

          jq -n \
            --arg captured_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg target_sha "${TARGET_SHA}" \
            --argjson runs "$(cat /tmp/runs.json)" \
            --argjson branch_present "${branch_present}" \
            --argjson issue "${issue_json}" \
            --argjson pr "${pr_json}" \
            --argjson commit "${commit_json}" \
            '{
              captured_at: $captured_at,
              target_sha: $target_sha,
              commit: {sha: $commit.sha, html_url: $commit.html_url, message: $commit.commit.message},
              workflow_runs: $runs,
              implementation_branch_present: $branch_present,
              goal_issue: {number: $issue.number, state: $issue.state, state_reason: $issue.state_reason, html_url: $issue.html_url},
              implementation_pr: {number: $pr.number, state: $pr.state, merged: $pr.merged, merged_at: $pr.merged_at, merge_commit_sha: $pr.merge_commit_sha, html_url: $pr.html_url}
            }' > docs/evidence/m1a-runtime-main-delivery-snapshot.json

          jq -e '.implementation_pr.merged == true' docs/evidence/m1a-runtime-main-delivery-snapshot.json
          jq -e '.implementation_pr.merge_commit_sha == .target_sha' docs/evidence/m1a-runtime-main-delivery-snapshot.json
          jq -e '[.workflow_runs[] | select(.event == "push" and .head_sha == .target_sha and .status == "completed" and .conclusion == "success") | .name] | index("m1a-memory-runtime-contracts") != null' docs/evidence/m1a-runtime-main-delivery-snapshot.json
          jq -e '[.workflow_runs[] | select(.event == "push" and .head_sha == .target_sha and .status == "completed" and .conclusion == "success") | .name] | index("test-workflow-ci") != null' docs/evidence/m1a-runtime-main-delivery-snapshot.json
          jq -e '[.workflow_runs[] | select(.event == "push" and .head_sha == .target_sha and .status == "completed" and .conclusion == "success") | .name] | index("release-test-harness") != null' docs/evidence/m1a-runtime-main-delivery-snapshot.json
          jq -e '.implementation_branch_present == false' docs/evidence/m1a-runtime-main-delivery-snapshot.json

          {
            echo '# M1A Runtime Main Delivery Snapshot'
            echo
            echo "- Target commit: \`${TARGET_SHA}\`"
            echo "- Captured at: $(jq -r .captured_at docs/evidence/m1a-runtime-main-delivery-snapshot.json)"
            echo "- PR #${IMPLEMENTATION_PR}: merged"
            echo "- Implementation branch present: ${branch_present}"
            echo
            echo '| Run | Event | ID | Number | Status | Conclusion |'
            echo '|---|---|---:|---:|---|---|'
            jq -r '.workflow_runs[] | "| \(.name) | \(.event) | \(.id) | \(.run_number) | \(.status) | \(.conclusion) |"' \
              docs/evidence/m1a-runtime-main-delivery-snapshot.json
          } > docs/evidence/m1a-runtime-main-delivery-snapshot.md

      - name: Commit evidence snapshot to probe branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/m1a-runtime-main-delivery-snapshot.json \
                  docs/evidence/m1a-runtime-main-delivery-snapshot.md
          git diff --cached --check
          git commit -m "Capture M1A main delivery evidence"
          git push origin HEAD:ops/m1a-runtime-closure-evidence
