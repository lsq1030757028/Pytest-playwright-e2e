name: m1a-contract-gap-fix-v4

on:
  pull_request:
    paths:
      - ".github/workflows/m1a-contract-gap-fix-v4.yml"

permissions:
  contents: write

jobs:
  harden-contract-gaps:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m1a-runtime-contract-remediation
          fetch-depth: 0

      - name: Execute corrected v3 remediation program
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/m1a-contract-gap-fix-v3.yml').read_text(encoding='utf-8')
          start = workflow.index("          from pathlib import Path\n")
          end = workflow.index("          PY\n", start)
          program = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end].splitlines()
          ) + "\n"
          old = '            f"    def {method}(\\n",\n            f"    @_synchronized\\n    def {method}(\\n",\n'
          new = '            f"    def {method}(",\n            f"    @_synchronized\\n    def {method}(",\n'
          if program.count(old) != 1:
              raise RuntimeError(f"decorator transform count={program.count(old)}")
          program = program.replace(old, new, 1)
          exec(compile(program, 'm1a-v4-remediation', 'exec'), {'__name__': '__main__'})
          PY

      - uses: astral-sh/setup-uv@v6

      - name: Verify remediation
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra test
          uv run ruff check \
            src/test_workflow/memory_contracts \
            tests/memory_contract_fixtures.py \
            tests/unit/test_memory_contract_models.py \
            tests/unit/test_memory_contract_policy.py \
            tests/unit/test_memory_contract_ports.py \
            tests/integration/test_memory_contract_reference.py \
            tests/integration/test_memory_contract_proof.py
          uv run pytest \
            tests/unit/test_memory_contract_models.py \
            tests/unit/test_memory_contract_policy.py \
            tests/unit/test_memory_contract_ports.py \
            tests/integration/test_memory_contract_reference.py \
            tests/integration/test_memory_contract_proof.py
          rm -rf test-results/m1a-contract-gap-fix
          uv run python -m test_workflow.memory_contracts.proof run \
            --output-dir test-results/m1a-contract-gap-fix \
            --code-sha "${GITHUB_SHA}"
          uv run python -m test_workflow.memory_contracts.proof replay \
            --output-dir test-results/m1a-contract-gap-fix

      - name: Commit verified remediation
        shell: bash
        run: |
          set -euo pipefail
          rm -f uv.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/test_workflow/memory_contracts/models.py \
            src/test_workflow/memory_contracts/reference.py \
            tests/unit/test_memory_contract_models.py \
            tests/integration/test_memory_contract_reference.py
          git diff --cached --check
          git commit -m "fix(m1a): close authority atomicity and evidence gaps"
          git push origin HEAD:agent/m1a-runtime-contract-remediation
