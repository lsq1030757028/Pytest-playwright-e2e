name: beta-a-acceptance

on:
  pull_request:
    paths:
      - "docs/evidence/beta-a-acceptance.yaml"
      - "tests/acceptance/**"
      - "tests/integration/test_beta_a_runtime_ux3.py"
      - "tests/integration/test_beta_a_runtime_docker.py"
      - "tests/unit/test_beta_a_runtime_*.py"
      - "src/test_workflow/beta_runtime/**"
      - "src/test_workflow/test_agent_cli.py"
      - ".github/workflows/beta-a-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "docs/evidence/beta-a-acceptance.yaml"
      - "tests/acceptance/**"
      - "tests/integration/test_beta_a_runtime_ux3.py"
      - "tests/integration/test_beta_a_runtime_docker.py"
      - "tests/unit/test_beta_a_runtime_*.py"
      - "src/test_workflow/beta_runtime/**"
      - "src/test_workflow/test_agent_cli.py"
      - ".github/workflows/beta-a-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  acceptance-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install test dependencies
        run: uv sync --extra test

      - name: Reverify bound GitHub implementation and closure evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p test-results
          uv run python tests/acceptance/verify_beta_a_acceptance_evidence.py \
            docs/evidence/beta-a-acceptance.yaml \
            | tee test-results/beta-a-historical-evidence.json

      - name: Acceptance contract core recovery and critical mutation proof
        run: |
          uv run pytest \
            tests/acceptance/test_beta_a_acceptance_contract.py \
            tests/unit/test_beta_a_runtime_core.py \
            tests/unit/test_beta_a_runtime_recovery.py \
            tests/unit/test_beta_a_runtime_mutation_proof.py \
            --junitxml=test-results/junit-beta-a-acceptance-core.xml

      - name: UX3 real CLI persona and adversarial recovery proof
        env:
          BETA_A_UX3_REPORT: test-results/beta-a-ux3-acceptance.json
        run: >-
          uv run pytest tests/integration/test_beta_a_runtime_ux3.py
          --junitxml=test-results/junit-beta-a-acceptance-ux3.xml

      - name: Build immutable local Playwright execution image
        shell: bash
        run: |
          cat > /tmp/beta-a-acceptance-worker.Dockerfile <<'EOF'
          FROM mcr.microsoft.com/playwright/python:v1.57.0-noble
          RUN python -m pip install --no-cache-dir pytest==9.1.1 playwright==1.57.0
          EOF
          docker build \
            --file /tmp/beta-a-acceptance-worker.Dockerfile \
            --tag beta-a-acceptance-worker:${GITHUB_SHA} \
            /tmp
          image_id="$(docker image inspect --format '{{.Id}}' beta-a-acceptance-worker:${GITHUB_SHA})"
          test "${image_id#sha256:}" != "${image_id}"
          echo "BETA_A_DOCKER_IMAGE=${image_id}" >> "${GITHUB_ENV}"

      - name: Real Docker Pytest Playwright isolation cancellation and replay proof
        run: >-
          uv run pytest tests/integration/test_beta_a_runtime_docker.py
          --junitxml=test-results/junit-beta-a-acceptance-docker.xml

      - name: Build wheel and install packaged Test Agent in clean environment
        shell: bash
        run: |
          uv build
          rm -rf /tmp/beta-a-acceptance-wheel
          uv venv /tmp/beta-a-acceptance-wheel
          uv pip install --python /tmp/beta-a-acceptance-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/beta-a-acceptance-wheel/bin/test-agent --help
          /tmp/beta-a-acceptance-wheel/bin/test-agent job --help
          /tmp/beta-a-acceptance-wheel/bin/test-agent runtime --help

      - name: Control-plane container smoke from packaged wheel
        shell: bash
        run: |
          cat > /tmp/beta-a-control-plane.Dockerfile <<'EOF'
          FROM python:3.12-slim
          COPY dist /dist
          RUN python -m pip install --no-cache-dir /dist/*.whl
          ENTRYPOINT ["test-agent"]
          EOF
          docker build \
            --file /tmp/beta-a-control-plane.Dockerfile \
            --tag beta-a-control-plane:${GITHUB_SHA} \
            .
          docker run --rm --network none beta-a-control-plane:${GITHUB_SHA} --help
          docker run --rm --network none beta-a-control-plane:${GITHUB_SHA} job --help
          docker run --rm --network none beta-a-control-plane:${GITHUB_SHA} runtime --help

      - name: Prepare packaged CLI governed fixture
        shell: bash
        run: |
          rm -rf /tmp/beta-a-acceptance-fixture /tmp/beta-a-acceptance-state
          BETA_A_DOCKER_IMAGE="${BETA_A_DOCKER_IMAGE}" uv run python - <<'PY' > /tmp/beta-a-acceptance-submission
          import os
          from pathlib import Path
          from tests.beta_a_helpers import make_governed_fixture

          _, _, _, submission = make_governed_fixture(
              Path("/tmp/beta-a-acceptance-fixture"),
              image=os.environ["BETA_A_DOCKER_IMAGE"],
          )
          print(submission)
          PY
          test -s /tmp/beta-a-acceptance-submission

      - name: Packaged CLI submit execute restart and replay truth
        shell: bash
        run: |
          submission="$(cat /tmp/beta-a-acceptance-submission)"
          state=/tmp/beta-a-acceptance-state
          cli=/tmp/beta-a-acceptance-wheel/bin/test-agent
          cd /tmp

          submit_json="$(${cli} job submit \
            "${submission}" --state-dir "${state}" --json)"
          job_id="$(python -c 'import json,sys; print(json.load(sys.stdin)["job_id"])' \
            <<< "${submit_json}")"
          test -n "${job_id}"

          ${cli} runtime serve \
            --once --worker-id acceptance-package-worker \
            --state-dir "${state}" --json
          result_one="$(${cli} job result \
            "${job_id}" --state-dir "${state}" --json)"
          verdict_one="$(python -c \
            'import json,sys; print(json.load(sys.stdin)["result"]["verdict"])' \
            <<< "${result_one}")"
          test "${verdict_one}" = "VERIFIED_SUCCESS"

          result_two="$(${cli} job result \
            "${job_id}" --state-dir "${state}" --json)"
          test "${result_two}" = "${result_one}"
          ${cli} runtime serve \
            --once --worker-id acceptance-restarted-worker \
            --state-dir "${state}" --json \
            | grep '"processed_job_id":null'
          printf '%s\n' "${result_one}" > "${GITHUB_WORKSPACE}/test-results/beta-a-packaged-result.json"

      - name: Validate acceptance evidence bundle shape
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          history = json.loads(Path("test-results/beta-a-historical-evidence.json").read_text())
          ux3 = json.loads(Path("test-results/beta-a-ux3-acceptance.json").read_text())
          result = json.loads(Path("test-results/beta-a-packaged-result.json").read_text())
          assert history["candidate_status"] == "CANDIDATE"
          assert len(history["pull_requests"]) == 2
          assert len(history["runs"]) == 10
          assert ux3["assurance"] == "UX3"
          assert ux3["journey_count"] == 9
          assert ux3["adversarial_recovery"]["automatic_reexecution"] is False
          assert result["result"]["verdict"] == "VERIFIED_SUCCESS"
          assert result["result"]["evidence_manifest"]["sha256"]
          PY

      - name: Upload BETA-A acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-a-acceptance-evidence
          path: |
            test-results
            dist
          if-no-files-found: error
          retention-days: 30
