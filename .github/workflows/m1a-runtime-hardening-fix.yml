name: m1a-runtime-hardening-fix

on:
  pull_request:
    paths:
      - ".github/workflows/m1a-runtime-hardening-fix.yml"

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Execute corrected SPEC-first hardening program
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/m1a-runtime-hardening.yml').read_text(encoding='utf-8')
          start_marker = "          from __future__ import annotations\n"
          end_marker = "          PY\n"
          start = workflow.index(start_marker)
          end = workflow.index(end_marker, start)
          program = workflow[start:end]
          program = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in program.splitlines()
          ) + "\n"

          def normalized(value: str) -> str:
              return "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in value.splitlines()
              ) + "\n"

          def replace_region(start_token: str, end_token: str, replacement: str) -> None:
              global program
              region_start = program.index(start_token)
              region_end = program.index(end_token, region_start)
              program = program[:region_start] + normalized(replacement) + program[region_end:]

          replace_region(
              'if "benchmark_refs_resolved" not in reference:\n',
              '\nold_acl =',
              '''if "benchmark_refs_resolved" not in reference:
                  promotion_start = reference.index(
                      "        decision = validate_promotion(",
                      reference.index("    def promote("),
                  )
                  promotion_end = reference.index(
                      "        if decision.decision",
                      promotion_start,
                  )
                  reference = (
                      reference[:promotion_start]
                      + new_promotion_call
                      + "\\n"
                      + reference[promotion_end:]
                  )
              ''',
          )
          replace_region(
              'if \'event_type="ACL_CHANGED"\' not in reference:\n',
              '\nif "def _record_namespace_audit("',
              '''if 'event_type="ACL_CHANGED"' not in reference:
                  acl_start = reference.index(
                      "        self._acl.setdefault(entry.namespace.canonical, []).append(entry)",
                      reference.index("    def append_acl_event("),
                  )
                  acl_end = reference.index("\\n\\n    def list_effective_acl", acl_start)
                  reference = reference[:acl_start] + new_acl + "\\n" + reference[acl_end:]
              ''',
          )
          exec(compile(program, 'm1a-runtime-hardening-program', 'exec'), {'__name__': '__main__'})
          Path('.github/workflows/m1a-runtime-hardening-fix.yml').unlink()
          PY

      - uses: astral-sh/setup-uv@v6

      - name: Verify hardened contracts before publishing branch commit
        run: |
          uv sync --extra test
          uv run ruff check \
            src/test_workflow/memory_contracts \
            tests/memory_contract_fixtures.py \
            tests/unit/test_memory_contract_policy.py \
            tests/integration/test_memory_contract_reference.py
          uv run pytest \
            tests/unit/test_memory_contract_models.py \
            tests/unit/test_memory_contract_policy.py \
            tests/unit/test_memory_contract_ports.py \
            tests/integration/test_memory_contract_reference.py \
            tests/integration/test_memory_contract_proof.py
          rm -rf test-results/m1a-hardening-proof
          uv run python -m test_workflow.memory_contracts.proof run \
            --output-dir test-results/m1a-hardening-proof \
            --code-sha "${GITHUB_SHA}"
          uv run python -m test_workflow.memory_contracts.proof replay \
            --output-dir test-results/m1a-hardening-proof

      - name: Commit hardened implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(m1a): harden namespace compatibility and authority contracts"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
