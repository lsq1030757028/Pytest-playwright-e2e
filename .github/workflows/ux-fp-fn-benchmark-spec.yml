name: ux-fp-fn-benchmark-spec

on:
  pull_request:
    paths:
      - "docs/specs/ux-fp-fn-benchmark.md"
      - "docs/specs/ux-fp-fn-benchmark.yaml"
      - "docs/security/ux-fp-fn-benchmark-threat-model.md"
      - "docs/testing/ux-fp-fn-benchmark-test-design.md"
      - "tests/unit/test_ux_fp_fn_benchmark_spec.py"
      - ".github/workflows/ux-fp-fn-benchmark-spec.yml"
  push:
    branches: [main]
    paths:
      - "docs/specs/ux-fp-fn-benchmark.md"
      - "docs/specs/ux-fp-fn-benchmark.yaml"
      - "docs/security/ux-fp-fn-benchmark-threat-model.md"
      - "docs/testing/ux-fp-fn-benchmark-test-design.md"
      - "tests/unit/test_ux_fp_fn_benchmark_spec.py"
      - ".github/workflows/ux-fp-fn-benchmark-spec.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install test dependencies
        run: uv sync --extra test

      - name: Prepare evidence directory
        run: mkdir -p test-results/ux-fp-fn-benchmark-spec

      - name: Lint SPEC contract tests
        run: uv run ruff check tests/unit/test_ux_fp_fn_benchmark_spec.py

      - name: Validate UX FP/FN benchmark SPEC
        run: |
          uv run pytest tests/unit/test_ux_fp_fn_benchmark_spec.py \
            --junitxml=test-results/ux-fp-fn-benchmark-spec/junit.xml

      - name: Upload SPEC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-fp-fn-benchmark-spec-results
          path: test-results/ux-fp-fn-benchmark-spec
          if-no-files-found: error
          retention-days: 30
