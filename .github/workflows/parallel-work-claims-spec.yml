name: Parallel Work Claims SPEC

"on":
  pull_request:
    paths:
      - "docs/specs/parallel-work-claims.md"
      - "docs/specs/parallel-work-claims.yaml"
      - "docs/product-work-map.md"
      - "docs/product-work-map.yaml"
      - "docs/test-design/parallel-work-claims-test-design.md"
      - "tests/unit/test_parallel_work_claims_spec.py"
      - ".github/workflows/parallel-work-claims-spec.yml"
      - ".gitleaks.toml"
      - ".gitleaksignore"
  push:
    branches: [main]
    paths:
      - "docs/specs/parallel-work-claims.md"
      - "docs/specs/parallel-work-claims.yaml"
      - "docs/product-work-map.md"
      - "docs/product-work-map.yaml"
      - "docs/test-design/parallel-work-claims-test-design.md"
      - "tests/unit/test_parallel_work_claims_spec.py"
      - ".github/workflows/parallel-work-claims-spec.yml"
      - ".gitleaks.toml"
      - ".gitleaksignore"
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate parallel work claim assets
        run: pytest -q tests/unit/test_parallel_work_claims_spec.py
      - name: Install pinned Gitleaks for redacted diagnosis
        run: >-
          bash scripts/security/install_gitleaks.sh
          "$RUNNER_TEMP/security-bin/gitleaks"
      - name: Emit redacted Gitleaks finding metadata
        shell: bash
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/security-bin/gitleaks
        run: |
          set +e
          output="$(bash scripts/security/run_gitleaks.sh "$GITHUB_WORKSPACE" 2>&1)"
          status=$?
          set -e
          while IFS= read -r line; do
            printf '::error title=Redacted Gitleaks diagnostic::%s\n' "$line"
          done <<< "$output"
          exit "$status"
