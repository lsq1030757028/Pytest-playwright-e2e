name: Relay Parallel Claim Migration Helper

"on":
  push:
    branches: [spec/hourly-github-relay]

permissions:
  contents: write

concurrency:
  group: relay-parallel-claim-migration-helper
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec/hourly-github-relay
          fetch-depth: 0

      - name: Verify fenced migration ownership
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          sleep 12
          git fetch origin ops/hourly-github-relay-control
          python - <<'PY'
          import json
          import os
          import subprocess

          lease_raw = subprocess.check_output(
              [
                  "git",
                  "show",
                  "origin/ops/hourly-github-relay-control:.agent/relay/leases/hourly-github-relay.json",
              ],
              text=True,
          )
          lease = json.loads(lease_raw)
          message = subprocess.check_output(["git", "log", "-1", "--pretty=%B"], text=True)
          expected_head = os.environ["EXPECTED_HEAD"]
          assert lease["status"] == "ACTIVE"
          assert lease["owner_surface"] == "HUMAN_CONTROL"
          assert lease["target_branch"] == "spec/hourly-github-relay"
          assert lease["target_head_sha"] == expected_head
          assert lease["run_token"]
          assert f"[RELAY:{lease['run_token']}]" in message
          PY

      - name: Patch protocol and product work map
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          addendum = "ADDENDUM-HOURLY-GITHUB-RELAY-PARALLEL-CLAIMS@0.2.0"
          spec_dir = Path("docs/specs")

          base_md_path = spec_dir / "hourly-github-relay.md"
          base_md = base_md_path.read_text(encoding="utf-8")
          isolation_bullet = "- `ADDENDUM-HOURLY-GITHUB-RELAY-CONVERSATION-ISOLATION@0.1.0`."
          parallel_bullet = f"- `{addendum}`."
          if parallel_bullet not in base_md:
              base_md = base_md.replace(
                  isolation_bullet,
                  isolation_bullet + "\n" + parallel_bullet,
                  1,
              )
          section = (
              "\n\n## 15. Parallel Work Item claiming production profile\n\n"
              "After the claim foundation in PRs #56 and #57, ordinary module development "
              "uses per-Work-Item claims rather than the repository-wide Relay Lease. Different "
              "non-conflicting Work Items may proceed concurrently; the same Work Item, exclusive "
              "domain, branch or PR remains single-owner.\n\n"
              "The compatibility Lease on `ops/hourly-github-relay-control` remains an exclusive "
              "maintenance and emergency-stop control. An ACTIVE compatibility Lease blocks new "
              "claims and development mutations.\n\n"
              "The authoritative claim registry is `.agent/relay/work-claims.json`. Module work "
              "may retain one claim across multiple Runs. Only evidence-ready work enters the "
              "integration queue, and merge, `main`, release and final project-state closure require "
              "the single holder of `.agent/relay/leases/integration.json`.\n\n"
              "`ADDENDUM-HOURLY-GITHUB-RELAY-PARALLEL-CLAIMS@0.2.0` supersedes earlier "
              "repository-wide development ownership while preserving conversation isolation, "
              "audit, fencing, safety and bounded-receipt rules.\n"
          )
          if "## 15. Parallel Work Item claiming production profile" not in base_md:
              base_md = base_md.rstrip() + section
          base_md_path.write_text(base_md, encoding="utf-8")

          base_yaml_path = spec_dir / "hourly-github-relay.yaml"
          base_yaml = base_yaml_path.read_text(encoding="utf-8")
          isolation_entry = "    - ADDENDUM-HOURLY-GITHUB-RELAY-CONVERSATION-ISOLATION@0.1.0"
          parallel_entry = f"    - {addendum}"
          if parallel_entry not in base_yaml:
              base_yaml = base_yaml.replace(
                  isolation_entry,
                  isolation_entry + "\n" + parallel_entry,
                  1,
              )
          profile = (
              "\n\nparallel_work_claiming_profile:\n"
              "  addendum: ADDENDUM-HOURLY-GITHUB-RELAY-PARALLEL-CLAIMS@0.2.0\n"
              "  ordinary_module_lock: WORK_ITEM_CLAIM\n"
              "  work_map: docs/product-work-map.yaml\n"
              "  claim_registry: ops/hourly-github-relay-control:.agent/relay/work-claims.json\n"
              "  integration_lease: ops/hourly-github-relay-control:.agent/relay/leases/integration.json\n"
              "  compatibility_lease:\n"
              "    path: ops/hourly-github-relay-control:.agent/relay/leases/hourly-github-relay.json\n"
              "    role: EXCLUSIVE_MAINTENANCE_AND_EMERGENCY_STOP\n"
              "    active_behavior: BLOCK_NEW_CLAIMS_AND_DEVELOPMENT_MUTATIONS\n"
              "  parallel_when_non_conflicting: true\n"
              "  reject_same: [WORK_ITEM, EXCLUSIVE_DOMAIN, TARGET_BRANCH, TARGET_PR]\n"
              "  claim_may_span_multiple_runs: true\n"
              "  integration_serialized: true\n"
              "  claim_alone_authorizes_merge: false\n"
              "  activation_requires_bounded_scheduled_claim_probe: true\n"
          )
          if "parallel_work_claiming_profile:" not in base_yaml:
              base_yaml = base_yaml.rstrip() + profile
          base_yaml_path.write_text(base_yaml, encoding="utf-8")

          map_path = Path("docs/product-work-map.yaml")
          work_map = map_path.read_text(encoding="utf-8")

          def update_item(text: str, work_item_id: str, changes: dict[str, str]) -> str:
              pattern = re.compile(
                  rf"(?ms)(^  - work_item_id: {re.escape(work_item_id)}\n)(.*?)(?=^  - work_item_id: |\Z)"
              )
              match = pattern.search(text)
              if not match:
                  raise AssertionError(f"missing Work Item {work_item_id}")
              block = match.group(1) + match.group(2)
              for key, value in changes.items():
                  field = re.compile(rf"(?m)^    {re.escape(key)}: .*$")
                  if not field.search(block):
                      raise AssertionError(f"{work_item_id} missing field {key}")
                  block = field.sub(f"    {key}: {value}", block, count=1)
              return text[: match.start()] + block + text[match.end() :]

          work_map = update_item(
              work_map,
              "PARALLEL-WORK-CLAIMS-SPEC",
              {"state": "CLOSED", "target_pr": "56"},
          )
          work_map = update_item(
              work_map,
              "PARALLEL-WORK-CLAIMS-IMPLEMENTATION",
              {
                  "state": "CLOSED",
                  "target_branch": "agent/parallel-work-claims",
                  "target_pr": "57",
              },
          )
          work_map = update_item(
              work_map,
              "RELAY-CONVERSATION-ISOLATION-CLOSE",
              {"state": "IN_PROGRESS"},
          )
          map_path.write_text(work_map, encoding="utf-8")

          Path(".github/workflows/relay-parallel-claim-migration-helper.yml").unlink()
          PY

      - name: Validate migration assets
        run: |
          python -m pip install -e ".[test]"
          pytest -q tests/unit/test_hourly_github_relay_parallel_claims.py

      - name: Commit fenced migration
        run: |
          git fetch origin spec/hourly-github-relay
          test "$(git rev-parse origin/spec/hourly-github-relay)" = "${GITHUB_SHA}"
          marker="$(git log -1 --pretty=%B | grep -o '\[RELAY:[^]]*\]' | head -n 1)"
          test -n "$marker"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/specs/hourly-github-relay.md \
            docs/specs/hourly-github-relay.yaml \
            docs/product-work-map.yaml \
            .github/workflows/relay-parallel-claim-migration-helper.yml
          git commit -m "docs(relay): activate parallel Work Item claim profile $marker"
          git push origin HEAD:spec/hourly-github-relay
