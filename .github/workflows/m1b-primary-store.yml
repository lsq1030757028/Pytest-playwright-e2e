name: m1b-primary-store

on:
  pull_request:
    paths:
      - "src/test_workflow/memory_store/**"
      - "tests/integration/test_m1b_sqlite_store.py"
      - "tests/integration/test_m1b_progressive_retrieval.py"
      - "tests/integration/test_m1b_exact_ref_scale.py"
      - ".github/workflows/m1b-primary-store.yml"
  push:
    branches: [main]
    paths:
      - "src/test_workflow/memory_store/**"
      - "tests/integration/test_m1b_sqlite_store.py"
      - "tests/integration/test_m1b_progressive_retrieval.py"
      - "tests/integration/test_m1b_exact_ref_scale.py"
      - ".github/workflows/m1b-primary-store.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-primary-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra test

      - name: Lint M1B primary Store and retrieval
        run: |
          uv run ruff check \
            src/test_workflow/memory_store \
            tests/integration/test_m1b_sqlite_store.py \
            tests/integration/test_m1b_progressive_retrieval.py \
            tests/integration/test_m1b_exact_ref_scale.py

      - name: Prove durable Store, progressive retrieval and preserved M1A contracts
        run: |
          uv run pytest \
            tests/integration/test_m1b_sqlite_store.py \
            tests/integration/test_m1b_progressive_retrieval.py \
            tests/integration/test_m1b_exact_ref_scale.py \
            tests/integration/test_memory_contract_reference.py \
            tests/integration/test_memory_contract_security_regression.py \
            -q
