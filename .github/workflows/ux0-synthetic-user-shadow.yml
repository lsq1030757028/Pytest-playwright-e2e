name: ux0-synthetic-user-shadow

on:
  pull_request:
    paths:
      - "src/test_workflow/ux/**"
      - "src/test_workflow/cli.py"
      - "benchmarks/ux/ux0/**"
      - "tests/unit/test_ux_shadow_runtime.py"
      - "tests/unit/test_ux_shadow_delivery_status.py"
      - "tests/unit/test_ux0_synthetic_user_approval.py"
      - "tests/integration/test_ux_shadow_runner_integration.py"
      - "docs/ux0-synthetic-user-shadow-runtime.md"
      - "docs/ux-assurance-status.md"
      - "docs/implementation-status.md"
      - "docs/implementation-ledger.yaml"
      - "pyproject.toml"
      - ".github/workflows/ux0-synthetic-user-shadow.yml"
      - ".github/workflows/cleanup-implementation-branches.yml"
  push:
    branches: [main]
    paths:
      - "src/test_workflow/ux/**"
      - "src/test_workflow/cli.py"
      - "benchmarks/ux/ux0/**"
      - "tests/unit/test_ux_shadow_runtime.py"
      - "tests/unit/test_ux_shadow_delivery_status.py"
      - "tests/unit/test_ux0_synthetic_user_approval.py"
      - "tests/integration/test_ux_shadow_runner_integration.py"
      - "docs/ux0-synthetic-user-shadow-runtime.md"
      - "docs/ux-assurance-status.md"
      - "docs/implementation-status.md"
      - "docs/implementation-ledger.yaml"
      - "pyproject.toml"
      - ".github/workflows/ux0-synthetic-user-shadow.yml"
      - ".github/workflows/cleanup-implementation-branches.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UX_CODE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra test

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Prepare evidence directory
        run: |
          mkdir -p test-results
          printf 'UX0 shadow runtime gate started for %s\n' "$UX_CODE_SHA" \
            > test-results/ci-status.txt

      - name: Lint Synthetic User runtime
        run: >-
          uv run ruff check
          src/test_workflow/ux
          src/test_workflow/cli.py
          tests/unit/test_ux_shadow_runtime.py
          tests/unit/test_ux_shadow_delivery_status.py
          tests/unit/test_ux0_synthetic_user_approval.py
          tests/integration/test_ux_shadow_runner_integration.py

      - name: Unit contract and delivery status evidence
        run: >-
          uv run pytest
          tests/unit/test_ux_shadow_runtime.py
          tests/unit/test_ux_shadow_delivery_status.py
          tests/unit/test_ux0_synthetic_user_approval.py
          --junitxml=test-results/junit-ux-shadow-unit.xml

      - name: Validate CLI campaign contract
        run: uv run test-workflow ux validate benchmarks/ux/ux0/campaign.yaml

      - name: Real pinned TodoMVC journeys and independent replay
        env:
          RUN_UX_INTEGRATION: "1"
          UX_EVIDENCE_DIR: test-results/ux-runtime
        run: >-
          uv run pytest tests/integration/test_ux_shadow_runner_integration.py
          -m ux_integration
          --junitxml=test-results/junit-ux-shadow-integration.xml

      - name: Upload Synthetic User evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ux0-synthetic-user-shadow-results
          path: test-results
          if-no-files-found: error
          retention-days: 30
