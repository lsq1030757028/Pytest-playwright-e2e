name: security-secrets

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-secrets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  full-history:
    name: gitleaks-full-history
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify complete checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test "$(git rev-list --all --count)" -gt 0

      - name: Install pinned Gitleaks
        shell: bash
        run: >-
          bash scripts/security/install_gitleaks.sh
          "$RUNNER_TEMP/security-bin/gitleaks"

      - name: Prove historical detection and redaction
        shell: bash
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/security-bin/gitleaks
        run: bash scripts/security/prove_gitleaks_history.sh

      - name: Scan complete repository history
        shell: bash
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/security-bin/gitleaks
        run: bash scripts/security/run_gitleaks.sh "$GITHUB_WORKSPACE"
