name: Parallel Work Claims Implementation

"on":
  pull_request:
    paths:
      - "src/test_workflow/relay_claims.py"
      - "src/test_workflow/relay_integration.py"
      - "tests/unit/test_relay_claims.py"
      - "tests/unit/test_relay_integration.py"
      - "tests/unit/test_relay_claim_schemas.py"
      - ".agent/relay/schemas/work-claims.schema.json"
      - ".agent/relay/schemas/integration-lease.schema.json"
      - ".github/workflows/parallel-work-claims-implementation.yml"
  push:
    branches: [main]
    paths:
      - "src/test_workflow/relay_claims.py"
      - "src/test_workflow/relay_integration.py"
      - "tests/unit/test_relay_claims.py"
      - "tests/unit/test_relay_integration.py"
      - "tests/unit/test_relay_claim_schemas.py"
      - ".agent/relay/schemas/work-claims.schema.json"
      - ".agent/relay/schemas/integration-lease.schema.json"
      - ".github/workflows/parallel-work-claims-implementation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate claim allocator and integration queue
        run: >-
          pytest -q
          tests/unit/test_relay_claims.py
          tests/unit/test_relay_integration.py
          tests/unit/test_relay_claim_schemas.py
