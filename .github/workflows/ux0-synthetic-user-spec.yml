name: ux0-synthetic-user-spec

on:
  pull_request:
    paths:
      - "docs/specs/ux0-synthetic-user-agent-spec.md"
      - "docs/specs/ux0-synthetic-user-agent.yaml"
      - "docs/specs/ux0-synthetic-user-agent-approval.yaml"
      - "docs/ux-assurance-ssot.md"
      - "docs/ux-assurance-ssot.yaml"
      - "docs/ux-assurance-status.md"
      - "docs/testing/ux0-synthetic-user-agent-test-design.md"
      - "tests/assets/ux/ux0/**"
      - "tests/unit/test_ux0_synthetic_user_spec.py"
      - "tests/unit/test_ux0_synthetic_user_approval.py"
      - "AGENTS.md"
      - ".github/ISSUE_TEMPLATE/goal.yml"
      - ".github/pull_request_template.md"
      - ".github/workflows/ux0-synthetic-user-spec.yml"
  push:
    branches: [main]
    paths:
      - "docs/specs/ux0-synthetic-user-agent-spec.md"
      - "docs/specs/ux0-synthetic-user-agent.yaml"
      - "docs/specs/ux0-synthetic-user-agent-approval.yaml"
      - "docs/ux-assurance-ssot.md"
      - "docs/ux-assurance-ssot.yaml"
      - "docs/ux-assurance-status.md"
      - "docs/testing/ux0-synthetic-user-agent-test-design.md"
      - "tests/assets/ux/ux0/**"
      - "tests/unit/test_ux0_synthetic_user_spec.py"
      - "tests/unit/test_ux0_synthetic_user_approval.py"
      - "AGENTS.md"
      - ".github/ISSUE_TEMPLATE/goal.yml"
      - ".github/pull_request_template.md"
      - ".github/workflows/ux0-synthetic-user-spec.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-spec:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra test

      - name: Lint UX0 policy tests
        run: >-
          uv run ruff check
          tests/unit/test_ux0_synthetic_user_spec.py
          tests/unit/test_ux0_synthetic_user_approval.py

      - name: Validate UX0 Synthetic User contracts and approval
        run: |
          mkdir -p test-results
          uv run pytest \
            tests/unit/test_ux0_synthetic_user_spec.py \
            tests/unit/test_ux0_synthetic_user_approval.py \
            --junitxml=test-results/junit-ux0-synthetic-user-spec.xml

      - name: Upload UX0 SPEC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux0-synthetic-user-spec-results
          path: test-results
          if-no-files-found: error
          retention-days: 30
