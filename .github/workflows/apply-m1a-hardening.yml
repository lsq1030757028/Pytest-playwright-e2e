name: Apply M1A hardening patch

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-m1a-hardening.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m1a-memory-runtime-contracts
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Apply governed hardening patch
        shell: bash
        run: |
          set -euo pipefail
          chunks=(
            tools/m1a-hardening/chunk-00a.b64
            tools/m1a-hardening/chunk-00b.b64
            tools/m1a-hardening/chunk-00c.b64
            tools/m1a-hardening/chunk-00d.b64
            tools/m1a-hardening/chunk-01.b64
            tools/m1a-hardening/chunk-02.b64
            tools/m1a-hardening/chunk-03.b64
            tools/m1a-hardening/chunk-04.b64
            tools/m1a-hardening/chunk-05a.b64
            tools/m1a-hardening/chunk-05b.b64
            tools/m1a-hardening/chunk-05c.b64
            tools/m1a-hardening/chunk-05d.b64
            tools/m1a-hardening/chunk-06a.b64
            tools/m1a-hardening/chunk-06b.b64
            tools/m1a-hardening/chunk-06c.b64
          )
          sha256sum "${chunks[@]}"
          cat "${chunks[@]}" > /tmp/m1a-hardening.patch.b64
          base64 --decode /tmp/m1a-hardening.patch.b64 > /tmp/m1a-hardening.patch
          sha256sum /tmp/m1a-hardening.patch
          echo "9d16033226beb3e69a49f33fa97ed87ac60fcff202757a2b2e236619298dce84  /tmp/m1a-hardening.patch" | sha256sum -c -
          git apply --check /tmp/m1a-hardening.patch
          git apply /tmp/m1a-hardening.patch
          git rm -r tools/m1a-hardening
          git rm -f --ignore-unmatch tools/m1a-bootstrap/part-00.b64
          git rm .github/workflows/apply-m1a-hardening.yml
          cp .github/m1a-memory-runtime-contracts.base.yml \
            .github/workflows/m1a-memory-runtime-contracts.yml
          rm .github/m1a-memory-runtime-contracts.base.yml
          git diff --check

      - name: Verify hardened M1A contracts
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra test
          uv run ruff check \
            src/test_workflow/memory_contracts \
            tests/memory_contract_fixtures.py \
            tests/unit/test_memory_contract_models.py \
            tests/unit/test_memory_contract_policy.py \
            tests/unit/test_memory_contract_ports.py \
            tests/integration/test_memory_contract_reference.py \
            tests/integration/test_memory_contract_proof.py
          uv run pytest \
            tests/unit/test_memory_contract_models.py \
            tests/unit/test_memory_contract_policy.py \
            tests/unit/test_memory_contract_ports.py \
            tests/integration/test_memory_contract_reference.py \
            tests/integration/test_memory_contract_proof.py
          rm -rf test-results/m1a-hardening-proof
          uv run python -m test_workflow.memory_contracts.proof run \
            --output-dir test-results/m1a-hardening-proof \
            --code-sha "${GITHUB_SHA}"
          uv run python -m test_workflow.memory_contracts.proof replay \
            --output-dir test-results/m1a-hardening-proof

      - name: Commit verified hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden M1A runtime contract enforcement"
          git push origin HEAD:agent/m1a-memory-runtime-contracts
