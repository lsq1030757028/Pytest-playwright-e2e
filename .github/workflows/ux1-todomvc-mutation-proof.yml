name: ux1-todomvc-mutation-proof

on:
  pull_request:
    paths:
      - "src/test_workflow/ux/**"
      - "src/test_workflow/ux_mutation/**"
      - "src/test_workflow/cli.py"
      - "benchmarks/ux/ux0/**"
      - "benchmarks/ux/ux1/**"
      - "tests/assets/ux/ux1/**"
      - "targets/percy-example-todomvc/**"
      - "tests/unit/test_ux_mutation_runtime.py"
      - "tests/integration/test_ux_mutation_proof_integration.py"
      - "docs/ux1-todomvc-mutation-proof-runtime.md"
      - "docs/ux-assurance-status.md"
      - "docs/implementation-status.md"
      - "docs/implementation-ledger.yaml"
      - "pyproject.toml"
      - ".github/workflows/ux1-todomvc-mutation-proof.yml"
      - ".github/workflows/cleanup-implementation-branches.yml"
  push:
    branches: [main]
    paths:
      - "src/test_workflow/ux/**"
      - "src/test_workflow/ux_mutation/**"
      - "src/test_workflow/cli.py"
      - "benchmarks/ux/ux0/**"
      - "benchmarks/ux/ux1/**"
      - "tests/assets/ux/ux1/**"
      - "targets/percy-example-todomvc/**"
      - "tests/unit/test_ux_mutation_runtime.py"
      - "tests/integration/test_ux_mutation_proof_integration.py"
      - "docs/ux1-todomvc-mutation-proof-runtime.md"
      - "docs/ux-assurance-status.md"
      - "docs/implementation-status.md"
      - "docs/implementation-ledger.yaml"
      - "pyproject.toml"
      - ".github/workflows/ux1-todomvc-mutation-proof.yml"
      - ".github/workflows/cleanup-implementation-branches.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UX_CODE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra test

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Prepare evidence directory
        run: |
          mkdir -p test-results
          printf 'UX1 mutation proof gate started for %s\n' "$UX_CODE_SHA" \
            > test-results/ux1-ci-status.txt

      - name: Lint UX Mutation Proof runtime
        run: >-
          uv run ruff check
          src/test_workflow/ux_mutation
          src/test_workflow/cli.py
          tests/unit/test_ux_mutation_runtime.py
          tests/integration/test_ux_mutation_proof_integration.py

      - name: Unit contract sandbox and state-machine evidence
        run: >-
          uv run pytest
          tests/unit/test_ux_mutation_runtime.py
          --junitxml=test-results/junit-ux1-mutation-unit.xml

      - name: Validate CLI campaign contract
        run: >-
          uv run test-workflow ux-mutation validate
          benchmarks/ux/ux1/campaign.yaml

      - name: Real five-mutation campaign and independent replay
        env:
          RUN_UX_MUTATION_INTEGRATION: "1"
          UX_MUTATION_EVIDENCE_DIR: test-results/ux-mutation
          UX_MUTATION_WORKSPACE: ${{ runner.temp }}/ux-mutation-workspace
        run: >-
          uv run pytest tests/integration/test_ux_mutation_proof_integration.py
          -m ux_integration
          --junitxml=test-results/junit-ux1-mutation-integration.xml

      - name: Upload UX Mutation Proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux1-todomvc-mutation-proof-results
          path: test-results
          if-no-files-found: error
          retention-days: 30
