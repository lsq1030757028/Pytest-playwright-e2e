name: m1c-memory-formation-spec

on:
  pull_request:
    paths:
      - "docs/specs/m1c-memory-formation-spec.md"
      - "docs/specs/m1c-memory-formation.yaml"
      - "docs/security/m1c-memory-formation-threat-model.md"
      - "docs/testing/m1c-memory-formation-test-design.md"
      - "tests/unit/test_m1c_memory_formation_spec.py"
      - ".github/workflows/m1c-memory-formation-spec.yml"
  push:
    branches: [main]
    paths:
      - "docs/specs/m1c-memory-formation-spec.md"
      - "docs/specs/m1c-memory-formation.yaml"
      - "docs/security/m1c-memory-formation-threat-model.md"
      - "docs/testing/m1c-memory-formation-test-design.md"
      - "tests/unit/test_m1c_memory_formation_spec.py"
      - ".github/workflows/m1c-memory-formation-spec.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-m1c-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra test

      - name: Lint focused M1C SPEC checks
        run: |
          uv run ruff check tests/unit/test_m1c_memory_formation_spec.py

      - name: Validate M1C governed formation SPEC
        run: |
          uv run pytest tests/unit/test_m1c_memory_formation_spec.py -q
