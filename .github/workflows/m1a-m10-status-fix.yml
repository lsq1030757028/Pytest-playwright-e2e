name: m1a-m10-status-fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m1a-m10-status-fix.yml"

permissions:
  contents: write

jobs:
  repair-m10-status-guard:
    if: github.event.pull_request.head.ref == 'docs/m1a-runtime-contracts-final-ledger-clean'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/m1a-runtime-contracts-final-ledger-clean
          fetch-depth: 0

      - name: Wait for and validate M1A Claim fencing
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          matched=false
          for attempt in $(seq 1 12); do
            git fetch --force origin \
              ops/hourly-github-relay-control:refs/remotes/origin/ops/hourly-github-relay-control
            git show \
              origin/ops/hourly-github-relay-control:.agent/relay/work-claims.json \
              > /tmp/work-claims.json
            if ACTUAL_HEAD="${actual_head}" python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          claims = json.loads(Path('/tmp/work-claims.json').read_text(encoding='utf-8'))
          claim = claims.get('claims', {}).get('M1A-RUNTIME-CONTRACTS-CLOSE', {})
          valid = claims.get('enabled') is True and claim == {
              **claim,
              'claim_token': 'claim-m1a-runtime-contracts-close-human-4-20260806T132500Z',
              'surface': 'HUMAN_CONTROL',
              'state': 'INTEGRATING',
              'target_branch': 'docs/m1a-runtime-contracts-final-ledger-clean',
              'target_pr': 64,
              'expected_head_sha': os.environ['ACTUAL_HEAD'],
          }
          sys.exit(0 if valid else 1)
          PY
            then
              matched=true
              break
            fi
            sleep 5
          done
          [[ "${matched}" == "true" ]]

      - name: Repair exact stale M1.0 state guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/unit/test_m1a_memory_contracts_spec.py')
          text = path.read_text(encoding='utf-8')
          old = 'assert m1["module_status"]["M1.0"] == "MERGED"'
          new = 'assert m1["module_status"]["M1.0"] == "MERGED_CLOSED"'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one stale M1.0 state assertion')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/m1a-m10-status-fix.yml').unlink()
          PY
          python -m pip install --disable-pip-version-check --quiet ruff==0.16.1
          python -m ruff check tests/unit/test_m1a_memory_contracts_spec.py
          python -m py_compile tests/unit/test_m1a_memory_contracts_spec.py

      - name: Commit repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lsq1030757028"
          git config user.email "lsq1030757028@gmail.com"
          git add \
            tests/unit/test_m1a_memory_contracts_spec.py \
            .github/workflows/m1a-m10-status-fix.yml
          git commit -m \
            "test(m1a): align M1.0 closed-state guard [HUMAN:human-m1a-close-r9-20260806T132900Z]"
          git push origin HEAD:docs/m1a-runtime-contracts-final-ledger-clean
