name: m1a-closure-ledger-finalize

on:
  push:
    branches:
      - docs/m1a-runtime-contracts-final-ledger

permissions:
  contents: write

jobs:
  finalize-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository and ledger dependencies
        run: python -m pip install --disable-pip-version-check -e . pyyaml pytest playwright

      - name: Execute the existing deterministic refresh script
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          import yaml

          helper = yaml.safe_load(
              Path('.github/workflows/m1a-closure-ledger-refresh.yml').read_text(
                  encoding='utf-8'
              )
          )
          steps = helper['jobs']['refresh-ledger']['steps']
          encoded = next(
              step['env']['REFRESH_SCRIPT_B64']
              for step in steps
              if 'env' in step and 'REFRESH_SCRIPT_B64' in step['env']
          )
          script = base64.b64decode(encoded).decode('utf-8')
          exec(compile(script, '<m1a-ledger-refresh>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Validate closure ledger tests
        run: |
          pytest -q \
            tests/unit/test_agent_os_roadmap.py \
            tests/unit/test_m1a_memory_delivery_status.py

      - name: Commit authoritative ledger and remove temporary executors
        shell: bash
        run: |
          rm .github/workflows/m1a-closure-ledger-refresh.yml
          rm .github/workflows/m1a-closure-ledger-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(m1a): attest remediated closure and advance M1B [RELAY:human-m1a-close-r9-20260806T132900Z]"
          git push origin HEAD:docs/m1a-runtime-contracts-final-ledger
