name: m1a-closure-ledger-refresh

on:
  push:
    branches:
      - docs/m1a-runtime-contracts-final-ledger

permissions:
  contents: write

jobs:
  refresh-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ledger dependencies
        run: python -m pip install --disable-pip-version-check pyyaml pytest

      - name: Refresh governed M1A closure evidence
        env:
          REFRESH_SCRIPT_B64: ""
        shell: bash
        run: |
          printf '%s' "$REFRESH_SCRIPT_B64" | base64 --decode > /tmp/refresh_m1a_ledger.py
          python /tmp/refresh_m1a_ledger.py

      - name: Validate closure ledger tests
        run: |
          pytest -q \
            tests/unit/test_agent_os_roadmap.py \
            tests/unit/test_m1a_memory_delivery_status.py

      - name: Commit refreshed ledger and remove helper
        shell: bash
        run: |
          rm .github/workflows/m1a-closure-ledger-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(m1a): attest remediated closure and advance M1B [RELAY:human-m1a-close-r9-20260806T132900Z]"
          git push origin HEAD:docs/m1a-runtime-contracts-final-ledger
