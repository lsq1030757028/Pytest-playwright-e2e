name: m1c-hot-formation

on:
  pull_request:
    paths:
      - "src/test_workflow/memory_formation/**"
      - "tests/integration/test_m1c_hot_formation.py"
      - ".github/workflows/m1c-hot-formation.yml"
  push:
    branches: [main]
    paths:
      - "src/test_workflow/memory_formation/**"
      - "tests/integration/test_m1c_hot_formation.py"
      - ".github/workflows/m1c-hot-formation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hot-formation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra test

      - name: Diagnose Ruff import ordering
        run: |
          uv run ruff check --fix src/test_workflow/memory_formation/runtime.py || true
          git diff -- src/test_workflow/memory_formation/runtime.py
          test -z "$(git diff --name-only -- src/test_workflow/memory_formation/runtime.py)"

      - name: Prove Hot Formation and prior Memory invariants
        run: |
          uv run pytest \
            tests/integration/test_m1c_hot_formation.py \
            tests/integration/test_m1b_sqlite_store.py \
            tests/integration/test_m1b_progressive_retrieval.py \
            tests/integration/test_m1b_resilience.py \
            tests/integration/test_m1b_recovery.py \
            tests/integration/test_m1b_migration.py \
            tests/integration/test_m1b_benchmark.py \
            tests/integration/test_memory_contract_reference.py \
            tests/integration/test_memory_contract_security_regression.py \
            -q
