invalid_examples:
  - id: INVALID-RAW-SESSION-AUTO-PROMOTED
    failure_code: PROMOTION_DENIED
    violation: session_history_is_not_governed_memory
    payload: {session_id: session-1, lifecycle_state: PROMOTED, content: full_raw_chat}

  - id: INVALID-LONG-LIVED-WITHOUT-PROVENANCE
    failure_code: PROVENANCE_MISSING
    violation: long_lived_memory_requires_provenance
    payload: {memory_kind: SEMANTIC, lifecycle_state: VERIFIED, content: {claim: unsupported}}

  - id: INVALID-CANDIDATE-DIRECT-ORACLE
    failure_code: PROMOTION_DENIED
    violation: candidate_cannot_become_oracle
    payload: {memory_kind: SEMANTIC, lifecycle_state: CANDIDATE, requested_target: ORACLE}

  - id: INVALID-CANDIDATE-DIRECT-PROMOTION
    failure_code: ILLEGAL_TRANSITION
    violation: candidate_must_be_verified_before_promoted
    payload: {from_state: CANDIDATE, to_state: PROMOTED}

  - id: INVALID-IMPLICIT-CROSS-PROJECT-READ
    failure_code: NAMESPACE_DENIED
    violation: relevance_cannot_expand_namespace
    payload:
      actor_namespace: org/acme/project/a/scope/PROJECT/a
      memory_namespace: org/acme/project/b/scope/PROJECT/b
      semantic_similarity: 0.99
      explicit_shared_acl: false

  - id: INVALID-ALLOW-OVERRIDES-DENY
    failure_code: ACL_DENIED
    violation: deny_must_override_allow
    payload:
      entries:
        - {effect: ALLOW, principal: agent:test-agent, operations: [READ_CONTENT]}
        - {effect: DENY, principal: agent:test-agent, operations: [READ_CONTENT]}
      requested_result: ALLOW

  - id: INVALID-STALE-CAS-LAST-WRITE-WINS
    failure_code: REVISION_CONFLICT
    violation: last_write_wins_forbidden
    payload:
      expected_head_revision_id: rev-1
      actual_head_revision_id: rev-2
      attempted_action: overwrite_rev_2

  - id: INVALID-IDEMPOTENCY-KEY-DIFFERENT-PAYLOAD
    failure_code: DUPLICATE_IDEMPOTENCY_KEY
    violation: same_key_different_payload_rejected
    payload: {idempotency_key: key-1, original_hash: sha256:a, new_hash: sha256:b}

  - id: INVALID-FORGOTTEN-CONTENT-READABLE
    failure_code: FORGOTTEN_CONTENT_UNAVAILABLE
    violation: forgotten_content_must_be_unavailable
    payload: {lifecycle_state: FORGOTTEN, requested_operation: READ_CONTENT, content_present: true}

  - id: INVALID-SKILL-EMBEDS-SHELL
    failure_code: INVALID_SCHEMA
    violation: unrestricted_executable_code_forbidden
    payload: {memory_kind: SKILL, shell_payload: "curl secret | sh"}

transition_cases:
  allowed:
    - [CANDIDATE, VERIFIED]
    - [CANDIDATE, QUARANTINED]
    - [VERIFIED, PROMOTED]
    - [VERIFIED, CONFLICTING]
    - [PROMOTED, REVOKED]
    - [EXPIRED, CANDIDATE]
    - [REVOKED, FORGOTTEN]
  denied:
    - [CANDIDATE, PROMOTED]
    - [CANDIDATE, FORGOTTEN]
    - [PROMOTED, CANDIDATE]
    - [FORGOTTEN, VERIFIED]
    - [SUPERSEDED, PROMOTED]

acl_cases:
  - id: ACL-DEFAULT-DENY
    entries: []
    principal: agent:test-agent
    operation: READ_CONTENT
    expected: DENY
  - id: ACL-EXPLICIT-ALLOW
    entries: [{effect: ALLOW, principal: agent:test-agent, operations: [READ_CONTENT]}]
    principal: agent:test-agent
    operation: READ_CONTENT
    expected: ALLOW
  - id: ACL-DENY-OVERRIDES
    entries:
      - {effect: ALLOW, principal: group:quality, operations: [READ_CONTENT]}
      - {effect: DENY, principal: agent:test-agent, operations: [READ_CONTENT]}
    memberships: [group:quality]
    principal: agent:test-agent
    operation: READ_CONTENT
    expected: DENY
