journeys:
  - journey_id: ux-journey-add-task
    revision: 1.0.0
    experience_oracle:
      oracle_id: UX-ORACLE-ADD-TASK
      revision: 1.0.0
      journey_goal: Add one task and understand that it remains present.
      business_value: User can capture a task without uncertainty or data loss.
      start_state: Empty TodoMVC list.
      required_checkpoints:
        - entry_field_is_discoverable
        - task_is_visible_after_submit
        - remaining_count_is_consistent
      success_outcomes:
        - one_visible_active_task_with_exact_text
        - active_count_equals_one
      forbidden_outcomes:
        - task_disappears_without_user_action
        - duplicate_task_created_by_single_submit
        - destructive_action_triggered
      required_feedback:
        - submitted_task_appears_in_list
        - remaining_count_updates
      recovery_expectations:
        - blank_input_does_not_create_task
        - user_can_retry_after_blank_input
      accessibility_obligations:
        - input_has_semantic_name
        - primary_action_is_keyboard_operable
      authoritative_friction_budgets:
        max_steps: 8
        max_backtracks: 1
      evidence_requirements: [TRACE, SCREENSHOT, STATE_HASH, ACCESSIBILITY_SNAPSHOT]
      severity_floor: P2
      authority_refs: [REQ-TODOMVC-ADD@v1]
    persona_refs: [ux-persona-novice@1.0.0]
    environment_refs: [ux-env-desktop-normal@1.0.0]
    start_fixture_ref: UX-TODOMVC-FIXTURE@1.0.0
    allowed_capabilities: [ux.execute.playwright, ux.observe.interaction, ux.observe.accessibility]
    required_observations: [task_completion, step_count, required_feedback_latency, semantic_accessibility_failures]
    cleanup_and_recovery: reset_local_storage

  - journey_id: ux-journey-keyboard-primary
    revision: 1.0.0
    experience_oracle:
      oracle_id: UX-ORACLE-KEYBOARD
      revision: 1.0.0
      journey_goal: Add, complete and filter a task with keyboard-only input.
      business_value: Keyboard users can complete the primary workflow.
      start_state: Empty TodoMVC list.
      required_checkpoints:
        - focus_reaches_input
        - task_can_be_submitted
        - task_can_be_completed
        - completed_filter_can_be_activated
      success_outcomes:
        - completed_task_visible_in_completed_filter
      forbidden_outcomes:
        - focus_trap
        - hidden_focus
        - pointer_required_for_primary_action
      required_feedback:
        - focus_state_is_observable
        - completion_state_is_observable
      recovery_expectations:
        - escape_from_nonmodal_state
      accessibility_obligations:
        - semantic_names_present
        - logical_focus_order
        - focus_visible
        - keyboard_completion
      authoritative_friction_budgets:
        max_steps: 12
        max_backtracks: 2
      evidence_requirements: [TRACE, VIDEO, ACCESSIBILITY_SNAPSHOT, FOCUS_EVENT_LOG]
      severity_floor: P1
      authority_refs: [REQ-TODOMVC-PRIMARY@v1]
    persona_refs: [ux-persona-keyboard@1.0.0]
    environment_refs: [ux-env-keyboard@1.0.0]
    start_fixture_ref: UX-TODOMVC-FIXTURE@1.0.0
    allowed_capabilities: [ux.execute.playwright, ux.observe.interaction, ux.observe.accessibility]
    required_observations: [keyboard_completion, focus_order_violations, semantic_accessibility_failures]
    cleanup_and_recovery: reset_local_storage

negative_cases:
  - id: UX-NEG-AI-BLOCKER
    violation: ai_finding_cannot_mark_blocker
    input:
      evidence_level: E0
      proposed_severity: P0
      source: ai_only
    expected: KEEP_NONBLOCKING_CANDIDATE

  - id: UX-NEG-EVALUATOR-LEAK
    violation: evaluator_only_fields_never_reach_actor
    input:
      actor_payload_contains: [hidden_expected_action]
    expected: INVALID

  - id: UX-NEG-SENSITIVE-PERSONA
    violation: sensitive_demographic_inference_forbidden
    input:
      profile_fields: [inferred_race]
    expected: REJECT

  - id: UX-NEG-PRODUCTION-DATA
    violation: synthetic_fixture_only
    input:
      account_and_data_state: production_customer_account
    expected: DENY

  - id: UX-NEG-BLOCKING-BEFORE-BENCHMARK
    violation: initial_runtime_mode_is_shadow
    input:
      requested_mode: BLOCKING
      benchmark_passed: false
    expected: PROMOTION_DENIED

  - id: UX-NEG-MISSING-ORACLE
    violation: blocker_requires_experience_oracle
    input:
      finding_state: REPRODUCED
      oracle_clause_refs: []
    expected: BLOCKED

verdict_cases:
  - id: UX-V-CRITICAL-TASK-FAIL
    evidence_level: E3
    critical_journey_completed: false
    expected_verdict: FAIL
  - id: UX-V-AI-OPINION
    evidence_level: E0
    ai_candidate_findings: 3
    deterministic_failures: 0
    expected_verdict: WARN
  - id: UX-V-TAMPERED
    evidence_integrity: false
    expected_verdict: INVALID
  - id: UX-V-MISSING-ORACLE
    oracle_present: false
    expected_verdict: BLOCKED
