apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-workflow-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-workflow-demo
  template:
    metadata:
      labels:
        app: test-workflow-demo
    spec:
      containers:
        - name: demo
          image: ghcr.io/OWNER/pytest-skill-playwright-workflow-demo:latest
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: test-workflow-demo
spec:
  selector:
    app: test-workflow-demo
  ports:
    - port: 80
      targetPort: 8000
