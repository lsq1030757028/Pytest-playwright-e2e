[project]
name = "pytest-skill-playwright-workflow"
version = "0.1.0"
description = "A reusable quality workflow built with Pytest, Agent Skills, and Playwright."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "jsonschema>=4.23.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "pyyaml>=6.0.2",
  "typer>=0.16.0",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
test = [
  "playwright>=1.57.0,<1.58.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[project.scripts]
test-workflow = "test_workflow.cli:app"
test-harness-ledger = "test_workflow.ledger_cli:app"
test-agent = "test_workflow.test_agent_cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/test_workflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers"]
markers = [
  "unit: pure business logic tests",
  "api: backend API tests",
  "e2e: browser end-to-end tests",
  "smoke: minimal critical-path tests",
  "regression: complete regression suite",
  "critical: release-blocking tests",
  "integration: live browser-to-service integration tests",
  "target_integration: pinned open-source target integration tests",
  "target_regression: deterministic business regression tests for pinned targets",
  "harness_integration: staged integration tests for the harness foundation",
  "ux_integration: real pinned-target Synthetic User journey and replay tests",
  "destructive: tests that modify or delete data",
  "serial: tests that cannot run in parallel",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"examples/demo_app/main.py" = ["E501"]
"src/test_workflow/cli.py" = ["B008"]
"src/test_workflow/harness/governance.py" = ["E501", "F401"]
"src/test_workflow/harness/intelligence.py" = ["E501"]
"src/test_workflow/harness/__init__.py" = ["I001"]
"src/test_workflow/ledger_cli.py" = ["B008"]
# Explicit branches are retained in security-sensitive contract validation for auditability.
"src/test_workflow/memory_contracts/models.py" = ["SIM102"]
"src/test_workflow/memory_contracts/policy.py" = ["SIM102", "SIM103"]
# Python 3.11 typing aliases and explicit error recovery remain stable public implementation details.
"src/test_workflow/memory_contracts/proof.py" = ["SIM105", "UP035"]
"src/test_workflow/memory_contracts/reference.py" = ["UP035"]
"src/test_workflow/proof.py" = ["I001"]
# ActorJourneyInput is intentionally part of the runner module's typed public boundary.
"src/test_workflow/ux/runner.py" = ["F401"]
"tests/integration/test_todomvc_target.py" = ["I001"]
"tests/unit/test_bundle.py" = ["I001"]
"tests/unit/test_harness_intelligence.py" = ["E501"]
"tests/unit/test_specs.py" = ["I001"]
