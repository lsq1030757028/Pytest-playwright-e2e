[project]
name = "pytest-skill-playwright-workflow"
version = "0.1.0"
description = "A reusable quality workflow built with Pytest, Agent Skills, and Playwright."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "pyyaml>=6.0.2",
  "typer>=0.16.0",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
test = [
  "playwright>=1.57.0,<1.63.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[project.scripts]
test-workflow = "test_workflow.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/test_workflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers"]
markers = [
  "unit: pure business logic tests",
  "api: backend API tests",
  "e2e: browser end-to-end tests",
  "smoke: minimal critical-path tests",
  "regression: complete regression suite",
  "critical: release-blocking tests",
  "integration: live browser-to-service integration tests",
  "destructive: tests that modify or delete data",
  "serial: tests that cannot run in parallel",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
