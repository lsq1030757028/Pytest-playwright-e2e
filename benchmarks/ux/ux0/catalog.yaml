journeys:
  - journey_id: novice-add-task
    revision: 1.0.0
    executor: TODO_ADD
    oracle:
      oracle_id: UX-ORACLE-ADD-TASK
      revision: 1.0.0
      journey_goal: Add one task and understand that it remains present.
      business_value: Capture a task without uncertainty or data loss.
      start_state: Empty TodoMVC list.
      required_checkpoints: [entry_field_is_discoverable, task_is_visible_after_submit, remaining_count_is_consistent]
      success_outcomes: [one_visible_active_task_with_exact_text, active_count_equals_one]
      forbidden_outcomes: [task_disappears_without_user_action, duplicate_task_created_by_single_submit, destructive_action_triggered]
      required_feedback: [submitted_task_appears_in_list, remaining_count_updates]
      recovery_expectations: [blank_input_does_not_create_task]
      accessibility_obligations: [input_has_semantic_name, primary_action_is_keyboard_operable]
      max_steps: 8
      max_backtracks: 1
      evidence_requirements: [TRACE, SCREENSHOT, STATE_HASH, ACCESSIBILITY_SNAPSHOT]
      severity_floor: P2
      authority_refs: [REQ-TODOMVC-ADD@v1]
    persona_refs: [novice-todo-user@1.0.0]
    environment_refs: [todomvc-desktop-novice@1.0.0]
    start_fixture_ref: UX-TODOMVC-EMPTY@1.0.0
    allowed_capabilities: [ux.execute.playwright, ux.observe.interaction, ux.observe.accessibility]
    required_observations: [task_completion, step_count, required_feedback_latency]
    cleanup_and_recovery: reset_local_storage
    evaluator_only: {hidden_expected_actions: [fill_new_todo_and_press_enter], scoring_key: add-task-v1, disallowed_shortcuts: [direct_local_storage_write], mutation_identity: null}
  - journey_id: returning-filter-persistence
    revision: 1.0.0
    executor: TODO_RETURNING_FILTER_PERSISTENCE
    oracle:
      oracle_id: UX-ORACLE-FILTER-PERSIST
      revision: 1.0.0
      journey_goal: Complete and filter tasks, then resume after reload.
      business_value: Returning users can trust filters and persisted state.
      start_state: Empty TodoMVC list.
      required_checkpoints: [task_can_be_completed, completed_filter_is_consistent, state_persists_after_reload, filter_route_persists_after_reload]
      success_outcomes: [completed_filter_shows_only_completed_task, reload_preserves_items_and_route]
      forbidden_outcomes: [active_task_lost, completed_state_reversed]
      required_feedback: [completed_filter_updates_visible_list]
      recovery_expectations: [reload_restores_state]
      accessibility_obligations: [filter_links_have_semantic_names]
      max_steps: 12
      max_backtracks: 2
      evidence_requirements: [TRACE, SCREENSHOT, STATE_HASH]
      severity_floor: P2
      authority_refs: [REQ-TODOMVC-FILTER-PERSIST@v1]
    persona_refs: [returning-todo-user@1.0.0]
    environment_refs: [todomvc-desktop-returning@1.0.0]
    start_fixture_ref: UX-TODOMVC-EMPTY@1.0.0
    allowed_capabilities: [ux.execute.playwright, ux.observe.interaction, ux.observe.feedback_and_recovery]
    required_observations: [task_completion, recovery_success, unexpected_state_loss]
    cleanup_and_recovery: reset_local_storage
    evaluator_only: {hidden_expected_actions: [add_two_complete_first_filter_completed_reload], scoring_key: filter-persist-v1, disallowed_shortcuts: [direct_local_storage_write], mutation_identity: null}
  - journey_id: keyboard-primary
    revision: 1.0.0
    executor: TODO_KEYBOARD_PRIMARY
    oracle:
      oracle_id: UX-ORACLE-KEYBOARD
      revision: 1.0.0
      journey_goal: Add a task with keyboard-only input.
      business_value: Keyboard users can complete the primary task-entry workflow.
      start_state: Empty TodoMVC list.
      required_checkpoints: [focus_reaches_input, task_can_be_submitted, semantic_name_is_present, keyboard_primary_action_completes]
      success_outcomes: [task_visible_after_keyboard_submit]
      forbidden_outcomes: [focus_trap, pointer_required_for_primary_action]
      required_feedback: [submitted_task_appears_in_list]
      recovery_expectations: []
      accessibility_obligations: [semantic_name_present, focus_reaches_input, keyboard_completion]
      max_steps: 8
      max_backtracks: 1
      evidence_requirements: [TRACE, SCREENSHOT, FOCUS_EVENT_LOG, ACCESSIBILITY_SNAPSHOT]
      severity_floor: P1
      authority_refs: [REQ-TODOMVC-KEYBOARD@v1]
    persona_refs: [keyboard-todo-user@1.0.0]
    environment_refs: [todomvc-keyboard@1.0.0]
    start_fixture_ref: UX-TODOMVC-EMPTY@1.0.0
    allowed_capabilities: [ux.execute.playwright, ux.observe.interaction, ux.observe.accessibility]
    required_observations: [keyboard_completion, focus_order_violations, semantic_accessibility_failures]
    cleanup_and_recovery: reset_local_storage
    evaluator_only: {hidden_expected_actions: [focus_type_enter], scoring_key: keyboard-v1, disallowed_shortcuts: [mouse_click, direct_local_storage_write], mutation_identity: null}
  - journey_id: interrupted-resume
    revision: 1.0.0
    executor: TODO_INTERRUPTED_RESUME
    oracle:
      oracle_id: UX-ORACLE-INTERRUPTED
      revision: 1.0.0
      journey_goal: Resume a task after a page refresh interruption.
      business_value: Interruption does not cause unexpected task loss.
      start_state: Empty TodoMVC list.
      required_checkpoints: [task_exists_before_interruption, task_persists_after_reload, visible_state_matches_storage]
      success_outcomes: [task_visible_and_stored_after_reload]
      forbidden_outcomes: [unexpected_state_loss]
      required_feedback: [persisted_task_is_visible_after_reload]
      recovery_expectations: [reload_restores_state]
      accessibility_obligations: []
      max_steps: 8
      max_backtracks: 1
      evidence_requirements: [TRACE, SCREENSHOT, STATE_HASH]
      severity_floor: P1
      authority_refs: [REQ-TODOMVC-PERSIST@v1]
    persona_refs: [interrupted-todo-user@1.0.0]
    environment_refs: [todomvc-interrupted@1.0.0]
    start_fixture_ref: UX-TODOMVC-EMPTY@1.0.0
    allowed_capabilities: [ux.execute.playwright, ux.observe.interaction, ux.observe.feedback_and_recovery]
    required_observations: [recovery_success, unexpected_state_loss]
    cleanup_and_recovery: reset_local_storage
    evaluator_only: {hidden_expected_actions: [add_reload_verify], scoring_key: interrupted-v1, disallowed_shortcuts: [direct_local_storage_write], mutation_identity: null}
