name: github-cloud-development-ssot
version: 1.3
status: ACTIVE
updated_at: 2026-08-10T11:34:00+08:00

scope:
  repository: lsq1030757028/Pytest-playwright-e2e
  applies_to:
    - human_developers
    - development_agents
    - review_agents
    - release_agents
    - all_repository_changes

entrypoints:
  agent: AGENTS.md
  normative_process: docs/github-development-ssot.md
  machine_policy: docs/github-development-ssot.yaml
  autonomy_mandate: docs/specs/autonomous-execution-mandate.yaml
  program_delivery: docs/program-delivery-ssot.yaml
  program_delivery_human: docs/program-delivery-ssot.md
  project_status: docs/implementation-status.md
  project_status_role: GENERATED_VIEW
  product_roadmap: docs/agent-os-evolution-roadmap.md
  product_roadmap_role: REFERENCE_ARCHITECTURE_AND_RESEARCH

active_autonomous_mandate:
  id: MANDATE-AUTONOMY-M1-M3
  version: 1.0.0
  status: ACTIVE
  authority_issue: 23
  scope_milestones: [M1, M2, M3]
  covered_profiles: [DEV0, DEV1, DEV2, DEV3]
  dev_e_covered: false
  repeated_human_approval_required: false
  reference: docs/specs/autonomous-execution-mandate.yaml
  revocable: true

source_of_truth:
  cloud_first: true
  authoritative_code_branch: main
  authoritative_verification: github_actions
  direct_main_write_allowed: false
  local_or_chat_results: supporting_only
  authority_order:
    - legal_privacy_security_and_organization_policy
    - confirmed_production_invariants_oracle_permission_release_controls
    - explicit_owner_authority
    - github_development_ssot
    - active_autonomous_mandate
    - approved_goal_or_issue
    - approved_module_spec
    - pull_request_plan_and_evidence
    - chat_comments_model_output_and_assumptions

authorization:
  answers: MAY_DO
  authority_order:
    - legal_privacy_security_and_organization_policy
    - confirmed_production_invariants_oracle_permission_release_controls
    - explicit_owner_authority
    - github_development_ssot
    - active_autonomous_mandate
    - approved_goal_or_issue
    - approved_module_spec
    - pull_request_plan_and_evidence
  delivery_ssot_may_expand_authority: false
  missing_authority_action: OUT_OF_MANDATE

delivery_selection:
  answers: SHOULD_DO_NEXT
  authoritative_source: docs/program-delivery-ssot.yaml
  human_companion: docs/program-delivery-ssot.md
  claim_registry_answers: WHO_DOES_IT
  claim_registry_may_define_product_priority: false
  claim_registry_may_define_product_completion_truth: false
  status_and_roadmaps_may_select_next_work: false
  conflict_action: REPLAN_REQUIRED
  chat_fallback_allowed: false

principles:
  - spec_before_implementation
  - standing_authority_not_repeated_approval
  - evidence_driven_not_confidence_driven
  - risk_adaptive_not_mechanical_test_checklists
  - change_specific_evidence_separate_from_repository_regression
  - smallest_sufficient_vertical_slice
  - versioned_assets_and_reproducible_environment
  - no_false_green
  - progressive_context_loading
  - reversible_changes_and_explicit_recovery
  - github_auditability
  - model_proposes_policy_decides
  - program_delivery_decides_next_work
  - claims_coordinate_ownership_not_product_priority

github_objects:
  goal_issue:
    owns:
      - business_goal
      - approved_scope
      - acceptance_criteria
      - constraints
      - initial_risk_signals
      - mandate_reference
  module_spec:
    owns:
      - authoritative_module_scope
      - architecture_and_contract_boundary
      - acceptance_and_failure_modes
      - test_obligations_and_evidence_plan
      - deployment_rollback_and_recovery_expectations
      - unresolved_decisions
    must_be_approved_before_runtime_implementation: true
    must_be_versioned: true
  autonomous_mandate:
    owns:
      - standing_authority
      - covered_milestones_and_profiles
      - excluded_external_boundaries
      - revocation_and_expiry
    must_be_versioned: true
    must_be_scope_limited: true
  program_delivery_ssot:
    owns:
      - top_level_product_state
      - active_and_next_product_slice
      - critical_path
      - capability_lane_mapping
      - work_item_product_priority
      - blocker_relationships
      - deterministic_next_work_policy
    may_expand_authority: false
    source: docs/program-delivery-ssot.yaml
  branch:
    owns:
      - isolated_implementation
      - temporary_work_state
    must_be_deleted_after_merge: true
  pull_request:
    owns:
      - change_plan
      - assurance_profile
      - spec_reference
      - mandate_reference
      - evidence_plan
      - review_and_merge_decision
  github_actions:
    owns:
      - authoritative_automated_verification
      - build_and_release_gates
  workflow_artifact:
    owns:
      - junit
      - logs
      - traces
      - replay
      - mutation
      - benchmark
      - build_outputs
  main:
    owns:
      - authoritative_code_and_documentation_baseline
  tag_release_ghcr:
    owns:
      - immutable_deployable_release
  status_and_ledgers:
    owns:
      - truthful_project_state_views
      - capability_and_asset_index
    may_select_next_work: false

lifecycle:
  states:
    - PROPOSED
    - TRIAGED
    - SPEC_DRAFT
    - SPEC_IN_REVIEW
    - SPEC_APPROVED
    - PLANNED
    - IMPLEMENTING
    - EVIDENCE_READY
    - IN_REVIEW
    - READY_TO_MERGE
    - MERGED
    - RELEASE_VERIFYING
    - CLOSED
    - REPLAN_REQUIRED
    - OUT_OF_MANDATE
    - BLOCKED
  normal_path:
    - PROPOSED
    - TRIAGED
    - SPEC_DRAFT
    - SPEC_IN_REVIEW
    - SPEC_APPROVED
    - PLANNED
    - IMPLEMENTING
    - EVIDENCE_READY
    - IN_REVIEW
    - READY_TO_MERGE
    - MERGED
    - RELEASE_VERIFYING
    - CLOSED
  replanning_triggers:
    - requirement_change
    - oracle_change
    - spec_semantic_change
    - mandate_scope_change
    - impact_expansion
    - evidence_invalidation
    - review_scope_gap
    - program_delivery_source_conflict
  blocked_triggers:
    - missing_authority
    - missing_or_inactive_mandate_for_autonomous_dev3
    - missing_approved_spec
    - missing_environment
    - missing_device
    - missing_secret_or_permission
    - conflicting_evidence
    - safety_gate_failure
    - out_of_mandate_external_action

spec_gate:
  required_for:
    - nontrivial_module
    - independently_deliverable_behavior_change
    - architecture_or_contract_change
    - dev2
    - dev3
  implementation_may_start_only_after_spec_merged_to_main: true
  separate_spec_and_implementation_pr_by_default: true
  required_content:
    - goal_scope_and_exclusions
    - authority_requirements_oracle_and_mandate
    - architecture_state_data_interfaces_and_dependencies
    - safety_privacy_permission_and_production_boundaries
    - falsifiable_acceptance_and_failure_modes
    - test_obligations_evidence_and_asset_plan
    - migration_deployment_rollback_and_recovery
    - unresolved_decisions_and_implementation_boundaries
  exceptions:
    DEV0:
      lightweight_inline_spec_allowed: true
      only_when_no_runtime_or_governance_effect: true
    DEV1:
      inline_spec_allowed: true
      only_when_small_independently_reviewable_and_no_shared_contract_change: true
    DEV-E:
      emergency_spec_required_before_action: true
      full_spec_backfill_required: true
      backfill_must_have_deadline: true
  requirement_change_after_spec:
    versioned_change_event_required: true
    impact_assessment_required: true
    affected_spec_and_evidence_invalidation_required: true
    silent_semantic_overwrite_prohibited: true
  spec_completion_does_not_complete_module: true

assurance_profiles:
  DEV0:
    title: non_behavioral_change
    default_for:
      - documentation
      - comments
      - formatting
      - non_behavioral_metadata
    unit_test_required_by_default: false
    integration_test_required_by_default: false
    evidence_selection:
      - lint_or_format
      - schema_or_structure_validation
      - reference_or_link_validation_when_applicable
      - targeted_policy_consistency_when_applicable
    escalation_signals:
      - changes_agent_behavior
      - changes_ci_or_release_behavior
      - changes_runtime_configuration

  DEV1:
    title: isolated_deterministic_logic
    default_for:
      - pure_function
      - parser
      - validator
      - local_refactor_without_contract_change
    unit_test_required_by_default: true
    integration_test_required_by_default: false
    evidence_selection:
      - focused_unit_or_property_test
      - contract_and_boundary_cases
      - rejection_paths
    escalation_signals:
      - touches_external_boundary
      - changes_shared_contract
      - historical_boundary_defect

  DEV2:
    title: boundary_or_workflow_change
    default_for:
      - capability_contract
      - api
      - storage
      - artifact_schema
      - orchestrator
      - state_machine
      - cli
      - network
      - browser
      - external_process
      - github_actions
      - build_or_release_pipeline
    approved_spec_required: true
    unit_or_contract_evidence_required: true
    boundary_integration_required_when_boundary_touched: true
    negative_or_failure_path_required: true
    selected_regression_required: true
    skipped_evidence_requires_reason: true
    authorization_mode: approved_goal
    repeated_human_approval_required: false

  DEV3:
    title: production_critical_or_system_governance
    default_for:
      - oracle
      - policy
      - permission
      - assurance_floor
      - memory_write_share_promotion_forget
      - controlled_self_evolution
      - model_routing_and_escalation
      - real_device_control
      - secret
      - production_data
      - financial
      - privacy
      - security
      - destructive_migration
      - release_gate
      - auto_merge_control
      - production_capability_promotion
    approved_spec_required: true
    independent_test_design_required: true
    threat_model_required: true
    unit_or_contract_evidence_required: true
    boundary_integration_required: true
    adversarial_or_negative_required: true
    proof_methods_choose_risk_matched_combination:
      - replay
      - mutation
      - benchmark
      - independent_verifier
      - stability_repetition
      - canary
    rollback_or_recovery_required: true
    authorization_mode: standing_mandate_or_explicit_human_approval
    repeated_human_approval_required_when_active_mandate_covers_change: false
    agent_may_downgrade: false

  DEV-E:
    title: emergency_change
    default_for:
      - production_incident
      - severe_security_defect
      - urgent_recovery
    emergency_spec_required: true
    minimum_safe_change: true
    minimum_trustworthy_evidence: true
    canary_or_small_rollout: true
    strong_monitoring: true
    rollback_required: true
    evidence_backfill_required: true
    backfill_must_have_deadline: true
    authorization_mode: explicit_human_approval
    standing_mandate_covers: false

evidence_model:
  test_obligation_required_for_nontrivial_changes: true
  selection_order:
    - static_or_schema
    - unit_or_property
    - contract_or_api
    - boundary_integration
    - browser_device_or_end_to_end
    - replay_mutation_benchmark_or_canary
  selection_rules:
    - observe_the_real_behavior_under_test
    - choose_lowest_cost_sufficient_evidence
    - do_not_mock_the_truth_boundary
    - explain_selected_and_skipped_layers
    - escalate_when_evidence_expands_risk
  change_specific_evidence:
    purpose: prove_the_current_change
    dynamically_selected: true
  repository_regression_gate:
    purpose: protect_existing_baseline
    current_strategy: full_github_actions_baseline
    may_become_impact_selected_only_after_trusted_impact_graph: true

required_invariants:
  critical_false_green: 0
  unauthorized_oracle_change: 0
  unauthorized_policy_change: 0
  unauthorized_permission_change: 0
  assumption_promoted_to_fact_or_oracle: 0
  runtime_implementation_without_approved_spec: 0
  autonomous_dev3_without_active_mandate_or_explicit_authority: 0
  out_of_mandate_action_executed: 0
  silent_spec_semantic_overwrite: 0
  hidden_failed_evidence: 0
  direct_main_write: 0
  main_or_release_failure_marked_closed: 0
  model_confidence_used_as_final_evidence: 0
  delivery_source_split_brain: 0
  claim_registry_product_priority_ownership: 0

planning:
  required_outputs_for_nontrivial_change:
    - goal_and_scope
    - module_spec
    - mandate_reference_when_applicable
    - change_and_dependency_map
    - assurance_profile_and_reason
    - acceptance_criteria_and_test_obligations
    - evidence_selection_and_skip_reasons
    - asset_plan
    - deployment_and_rollback_impact
    - assumptions_risks_and_blockers
  delivery_selection_source: docs/program-delivery-ssot.yaml
  spec_before_runtime_implementation: true
  dev2_dev3_spec_separate_pr_by_default: true
  dev2_dev3_test_design_before_implementation: true
  dev0_dev1_may_inline_spec_and_test_design_in_pr: true
  vertical_slice_required: true

asset_management:
  specs: docs/specs
  mandates: docs/specs
  test_design: docs/testing
  golden_negative_adversarial: tests/assets
  unit_contract: tests/unit
  api: tests/api
  integration: tests/integration
  e2e: tests/e2e
  regression: tests/regression
  replay: experiments
  mutation: proofs
  benchmark: benchmarks
  runtime_evidence: github_actions_artifacts
  admission_requires:
    - requirement_invariant_risk_or_defect_binding
    - explicit_oracle
    - diagnosable_failure
    - reproducible_data_and_environment
    - acceptable_cost
    - no_unexplained_duplicate
    - owner_version_and_scope
  retirement_requires:
    - recorded_reason
    - historical_mapping_preserved

agent_autonomy:
  may:
    - create_goal_and_spec_branch
    - create_spec_pull_request
    - create_implementation_branch_after_spec_approved
    - implement_within_approved_goal_spec_and_mandate
    - create_pull_request
    - select_and_explain_evidence
    - trigger_github_actions
    - fix_evidence_backed_findings
    - review_and_merge_in_scope_dev3
    - publish_packages_and_images
    - update_status_and_ledgers_truthfully
    - clean_merged_temporary_branch
  may_auto_merge_profiles:
    - DEV0
    - DEV1
    - DEV2
    - DEV3
  auto_merge_conditions:
    - approved_goal_scope_unchanged
    - approved_spec_present_when_required
    - active_mandate_covers_goal_profile_and_spec_when_dev3
    - all_required_checks_green
    - profile_specific_evidence_sufficient
    - unresolved_review_threads_zero
    - blockers_zero
    - critical_false_green_zero
    - assets_and_status_updated
    - deployment_and_rollback_credible
  must_pause_or_escalate:
    - unclear_requirement_authority
    - missing_or_conflicting_spec
    - inactive_or_noncovering_mandate_for_dev3
    - oracle_or_higher_authority_conflict
    - out_of_mandate_production_write
    - secret_or_personal_data_boundary
    - real_device_dangerous_operation_without_bounded_spec
    - irreversible_resource_or_cost
    - evidence_conflict
    - goal_or_mandate_scope_expansion
    - dev_e_production_action
    - program_delivery_source_conflict
  explicit_human_approval_required_for:
    - dev3_not_covered_by_active_mandate
    - DEV-E_production_action
    - mandate_creation_scope_expansion_or_revocation
    - out_of_mandate_or_higher_authority_override
    - secret_or_production_personal_data
    - destructive_production_migration
    - material_irreversible_external_cost
  prohibited:
    - direct_main_push
    - runtime_implementation_before_required_spec_merged
    - autonomous_dev3_without_active_covering_mandate
    - out_of_mandate_external_action
    - silent_spec_semantic_overwrite
    - silent_oracle_change
    - silent_assurance_downgrade
    - assertion_deletion_for_green
    - fixed_sleep_or_blind_retry_for_green
    - chat_state_as_repository_ssot
    - deprecated_delivery_source_selection
    - claim_registry_as_product_priority_source
    - candidate_asset_direct_production_promotion
    - unrecorded_release_change

pull_request:
  required_sections:
    - goal_and_scope
    - spec_reference_and_phase
    - autonomy_mandate_reference
    - assurance_profile
    - change_map
    - acceptance_and_evidence_matrix
    - tests_selected_and_skipped_reasons
    - assets_changed
    - requirement_or_oracle_changes
    - deployment_and_rollback
    - blockers_and_residual_risk
    - merge_eligibility
  template: .github/pull_request_template.md

review:
  must_consider:
    - goal_spec_and_mandate_drift
    - program_delivery_and_product_priority_drift
    - business_truth_and_oracle
    - assurance_underclassification
    - evidence_observability
    - mock_truth_boundary
    - false_green
    - permission_budget_context_side_effects
    - model_memory_device_and_data_provenance
    - out_of_mandate_external_effect
    - asset_maintainability
    - deployment_and_rollback
  blocking_findings_must_be_resolved_or_explicitly_accepted: true

merge_policy:
  direct_main_write_allowed: false
  required_checks_green: true
  unresolved_review_threads: 0
  critical_false_green: 0
  required_spec_must_be_merged_before_implementation_pr: true
  dev3_requires_active_covering_mandate_or_explicit_authority: true
  main_merge_does_not_equal_release_verified: true

release_policy:
  main_push_verification_required: true
  build_artifacts_required_when_applicable: true
  release_or_ghcr_verification_required_when_applicable: true
  migration_compatibility_required_when_applicable: true
  smoke_probe_or_canary_required_when_applicable: true
  rollback_or_recovery_required: true
  release_failure_prevents_closed_status: true

closure:
  required_updates:
    - program_delivery_when_product_state_changes
    - project_status
    - implementation_or_experiment_ledger
    - goal_spec_mandate_pr_commit_ci_release_artifact_mapping
    - asset_add_change_invalidate_retire_record
    - known_limitations_and_next_state
    - temporary_branch_cleanup
  definition_of_done:
    - goal_satisfied
    - scope_and_mandate_coverage_confirmed
    - required_spec_approved_and_merged
    - profile_justified
    - obligations_have_sufficient_evidence
    - repository_regression_passed
    - review_blockers_resolved
    - main_and_release_verified
    - assets_and_ledgers_truthful
    - rollback_or_recovery_credible
    - temporary_state_cleaned

self_change_policy:
  minimum_profile: DEV2
  dev3_when_relaxing:
    - spec_gate
    - safety_boundary
    - auto_merge
    - oracle
    - policy
    - permission
    - production_approval
    - mandate_scope
    - delivery_selection_authority
  owner_authorization_for_current_change:
    issue: 91
    mandate_spec: SPEC-PROGRAM-DELIVERY-SSOT@1.0.0
  required_consistency_files:
    - AGENTS.md
    - docs/github-development-ssot.md
    - docs/github-development-ssot.yaml
    - docs/program-delivery-ssot.md
    - docs/program-delivery-ssot.yaml
    - docs/specs/autonomous-execution-mandate.yaml
    - docs/specs/parallel-work-claims.md
    - docs/specs/parallel-work-claims.yaml
    - docs/specs/hourly-github-relay-prompt.md
    - .github/ISSUE_TEMPLATE/goal.yml
    - .github/pull_request_template.md
    - tests/unit/test_github_development_ssot.py
    - tests/unit/test_autonomous_execution_mandate.py
    - tests/unit/test_program_delivery.py
    - tests/unit/test_program_delivery_source_consistency.py
