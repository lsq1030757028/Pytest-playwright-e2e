product_slices:
  BETA-A:
    title: Execute an existing governed test pack
    state: CLOSED
    dependencies: []
    user_entrypoint: CLI
    user_outcome: durable_job_returns_evidence_backed_verdict
    completion_gate:
      real_submit_status_result_cancel: required
      sqlite_restart: required
      worker_lease_fencing: required
      pytest_playwright_execution: required
      evidence_bundle_replay: required
      cancellation_cleanup: required
      package_container_smoke: required
      critical_false_green_count: 0
      unverifiable_success_count: 0
      duplicate_execution_after_restart_count: 0
  BETA-B:
    title: Generate and execute a bounded test from a requirement
    state: PREPARING
    dependencies: [BETA-A]
    user_entrypoint: CLI
    user_outcome: requirement_becomes_reviewable_executed_test_patch
    completion_gate:
      product_source_write_count: 0
      fixed_sleep_or_blind_retry_count: 0
      missing_oracle_success_count: 0
  BETA-C:
    title: Diagnose repair and re-run
    state: BLOCKED
    dependencies: [BETA-B]
    user_entrypoint: CLI
    user_outcome: test_defect_is_repaired_product_defect_is_reported
    completion_gate:
      maximum_repair_cycles: 2
      unauthorized_product_repair_count: 0
      assertion_weakening_count: 0
  BETA-D:
    title: Resume the same job after restart with governed context
    state: BLOCKED
    dependencies: [BETA-A, BETA-C]
    user_entrypoint: CLI
    user_outcome: durable_resume_without_chat_history_or_duplicate_work
    completion_gate:
      lost_job_count: 0
      duplicate_uncertain_side_effect_count: 0
      cross_project_memory_leak_count: 0
  BETA-E:
    title: Two-project operating Beta acceptance
    state: BLOCKED
    dependencies: [BETA-B, BETA-C, BETA-D]
    user_entrypoint: CLI
    user_outcome: new_user_runs_beta_against_two_supported_projects
    completion_gate:
      supported_projects: 2
      healthy_false_positive_count: 0
      critical_false_green_count: 0
      human_uat_complete: true

execution_pointer:
  active_slice: BETA-B
  current_focus: BETA-B-SPEC
  next_slice_after_active: BETA-C
  critical_path:
    - BETA-B-SPEC
    - BETA-B-IMPLEMENTATION
    - BETA-B-ACCEPTANCE
  rationale: >-
    BETA-A operating acceptance PR #100 is merged to main as
    056d8819e6b7da507c8f9ed1be3ab8fca77f046a. The exact main commit passed
    beta-a-acceptance run 31658662384, Full Quality run 31658662425,
    Secret Scan run 31658662439, CodeQL run 31658662475, and Release run
    31658662468. BETA-A is therefore verified and closable. Goal #101 authorizes
    BETA-B SPEC work only; BETA-B generation implementation remains blocked
    until its SPEC is merged and main-verified.

