selection_policy:
  claimable_states: [READY]
  dependency_closed_states: [CLOSED]
  classes_in_order:
    - SECURITY_CORRECTNESS_REPAIR
    - ACTIVE_SLICE_BLOCKER
    - ACTIVE_SLICE_CLOSER
    - DEPENDENCY_UNBLOCKING_INTEGRATION
    - ACTIVE_OR_NEXT_SLICE_PARALLEL_CAPABILITY
    - NEXT_SLICE_REQUIRED_PREPARATION
    - UNMAPPED_HORIZONTAL_INFRASTRUCTURE
  tie_break:
    - explicit_priority_desc
    - work_item_id_asc
  forbidden_priority_signals:
    - milestone_number
    - file_age
    - pr_number
    - discussion_volume
    - claim_registry_sequence
  critical_path_requires_any:
    - blocks_slice
    - closes_slice
    - unblocks_integration
  unknown_authority_action: BLOCKED
  unknown_scope_action: REPLAN_REQUIRED

