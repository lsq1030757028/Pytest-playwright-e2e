    - REDUCE_RACE_CONDITIONS
    - PRESERVE_CAMPAIGN_COHERENCE
  future_specialists_require:
    - SAME_CAMPAIGN_LEASE
    - EXPLICIT_INPUT_STATE
    - EXPLICIT_OUTPUT_STATE
    - NO_SAME_BRANCH_OVERLAP
    - GITHUB_HANDOFF
    - BUSY_ON_FOREIGN_LEASE
  example_states:
    - ORIENTING
    - PLAN_READY
    - IMPLEMENTING
    - WAITING_CI
    - REVIEWING
    - CLOSING
