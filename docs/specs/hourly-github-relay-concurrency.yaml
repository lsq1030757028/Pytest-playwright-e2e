addendum_id: ADDENDUM-HOURLY-GITHUB-RELAY-CONCURRENCY@0.1.1
parent_spec: SPEC-HOURLY-GITHUB-RELAY@0.1.0
goal_issue: 49
status: CANDIDATE_PILOT_APPROVED
control_plane:
