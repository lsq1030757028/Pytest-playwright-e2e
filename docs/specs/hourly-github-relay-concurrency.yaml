  no_force_push: true
  no_reset: true
  no_delete: true
  start_annotation: STALE_LEASE_RECOVERED
surfaces:
  chat_and_codex_equal_priority: true
  relay_compatible_manual_sessions_use_same_lease: true
pipeline:
  pilot_mode: SINGLE_HOURLY_ORCHESTRATOR
  separate_stage_tasks_initially_forbidden: true
  reason:
