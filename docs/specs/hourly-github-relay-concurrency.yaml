    - START_COMMENT
    - DEVELOPMENT_BRANCH_WRITE
    - TEST_MUTATION
    - CI_RERUN
  acquisition:
    - RESOLVE_CAMPAIGN
    - FETCH_LEASE_AND_BLOB_SHA
