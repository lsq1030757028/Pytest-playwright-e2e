  release:
    final_status: IDLE
    preserve_last_run_summary: true
  force_update: forbidden
busy:
  development_writes: forbidden
  ci_rerun_owned_by_active_run: forbidden
  competing_branch_or_pr: forbidden
  chat_final: required
  optional_record_target: ISSUE_49
stale_recovery:
