  - INFRASTRUCTURE_OUTAGE
  - SINGLE_MODULE_CLOSED
  - NO_CHANGE_IN_ONE_HOUR
  - DRAFT_OR_UNMERGED_PR
  - PR_CI_PASS_WITHOUT_MAIN_RELEASE_LEDGER_CLEANUP
termination_evaluation_order:
  - OWNER_STOP_OR_REVOCATION
  - PILOT_ABORTED
  - PILOT_ACCEPTED
  - PROGRAM_COMPLETE
  - ACTIVE_CAMPAIGN
  - BLOCKED_WAITING_NO_ACTION
