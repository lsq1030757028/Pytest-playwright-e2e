    - M2_MODEL_GENERALIZATION_GATE_PASS_CLOSED
    - M3_PROJECT_ARCHITECTURE_GENERALIZATION_GATE_PASS_CLOSED
    - GLOBAL_SAFETY_GATE_PASS
    - STAGE_DELIVERY_TEST_AGENT_RUNTIME_BETA
    - ALL_REQUIRED_M1_M3_GOALS_CLOSED
    - ALL_REQUIRED_M1_M3_PRS_MERGED_OR_CLOSED_TRUTHFULLY
    - MAIN_RELEASE_LEDGER_CLEANUP_CLOSED
    - NO_BLOCKING_HUMAN_UAT_OR_REQUIRED_EVIDENCE
  terminal_status: PROGRAM_COMPLETE
  terminal_actions:
    - RELEASE_LEASE
    - WRITE_FINAL_DELIVERY_SUMMARY
